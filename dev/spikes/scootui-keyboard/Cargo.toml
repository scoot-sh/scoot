[package]
name = "scootui-keyboard-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace]

[lib]
name = "spike"
path = "src/lib.rs"

[[bin]]
name = "spike-kbvm"
path = "src/bin/kbvm.rs"

[[bin]]
name = "spike-xkb"
path = "src/bin/xkb.rs"

[[bin]]
name = "spike-base"
path = "src/bin/base.rs"

[[bin]]
name = "spike-wl"
path = "src/bin/wl.rs"

[dependencies]
kbvm = { version = "0.2.0", features = ["compose"] }
xkbcommon = "0.9.0"
rustix = { version = "1", features = ["event"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
