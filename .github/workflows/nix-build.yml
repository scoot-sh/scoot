# The expensive half of gh #173 -- the packaged artifacts users install.
#
# WHY THIS IS NOT IN ci.yml: `nix build` compiles the full release
# dependency tree (Smithay included) inside the Nix store, which shares
# nothing with ci.yml's cargo `target/` cache -- and until Cachix there
# was no Nix store cache at all (see ci.yml's note on magic-nix-cache),
# so every run paid the full build from scratch. Measured 5m10s cold on
# the 4-vCPU dev VM for both packages together (2026-09-21, branch
# `backlog/ci-nix-packaging`), which is the same core count as these
# runners, so that number is representative, not a lower bound. That cost
# belongs on each merge to main, not on every PR push: ci.yml's every-PR
# `nix flake check` already evals every output for its system and runs the
# module suite (`checks.*.scoot-modules`), so what only this workflow can
# catch is a *compile* breakage under `buildRustPackage` -- a stale
# `cargoLock.outputHashes` after a Smithay rev bump, a missing
# `buildInputs` C library, a file the build reads that fell out of the
# fileset `src`. Rare, and worth one post-merge run rather than a per-push
# tax. A red main here names the merge that broke the packaged build, and
# is fixed forward like any other main-red. (Nightly was the other option;
# it leaves main red for up to a day, which is strictly worse.)
#
# CACHIX, PUSHED FROM MAIN ONLY: the `cachix/cachix-action` step below
# pulls from the public `scoot-sh` cache on every run and pushes what the
# run built -- but only when the run is a `push` to `main` (`skipPush`
# otherwise). Unreviewed code must not reach a cache users trust, so
# manual `workflow_dispatch` runs only pull: they verify the build without
# publishing it. (PRs never reach this workflow at all -- it triggers on
# `push` to `main` and manual dispatch only.)
#
# The `--version` lines turn "it compiled" into "the artifact runs": both
# print without starting a session, so they need no seat, no socket and no
# GPU. Separate `nix build` invocations (rather than one command building
# both) only so each artifact gets a deterministic out-link for those
# lines; the derivations built are the same either way.
#
# WHAT THIS CANNOT COVER: the same runner limits as ci.yml (no seat, no
# VT, no /dev/dri, no GPU) -- this builds the binaries and prints their
# versions, it never starts a session. Behavior stays on the dev VM behind
# `cargo` and `scripts/smoke-test.sh`. The Darwin package
# (`packages.aarch64-darwin.*`) is likewise not built here -- macOS CI in
# this repo is check-only by decision, so that artifact stays covered the
# way it is today (local `nix build` on a Mac).
#
# scootbar (docs/scootbar/backlog/resolved/nix-package-done.md) is built
# here too, with three checks only the packaged artifact can answer: that
# it links nothing beyond glibc (libc, libm) and libgcc_s -- no libEGL, no
# libgbm, no libwayland -- as the cargo job asserts of its own build; that
# no font entered its closure (the demo carries one, the bar must not);
# and that a Cargo feature set given through `.override` reaches the build
# (the no-modules bar's `--help` says it has none). The demo is a wrapper
# over the same binary, so building it costs a shell script, and its run
# of `--version` proves the wrapper passes a command through.
#
# gpu-scanout is deliberately NOT built here: `packages.scoot-gpu` exists
# since PR #198, but each main-push build pays a full Smithay rebuild the
# cargo cache can't help with, and the packaged artifacts above are the
# ones users install. Cachix changes who *installs* benefit, not what CI
# pays to build: without crane (docs/backlog/packaging/nix-crane.md) every
# extra package derivation recompiles the whole dependency graph, so
# adding `scoot-gpu` here would buy one more full Smithay compile per push
# per architecture. Reconsider once crane lands -- that entry says so. The
# `-gpu` derivation stays covered the way it was before it existed (local
# `nix build .#scoot-gpu`).
#
# FLAKEHUB (below, `publish` job): after both arch builds succeed on a push
# to main, the flake itself is published to FlakeHub as a rolling release
# (`scoot-sh/scoot`, public, `0.1.*`), so a published flake version always
# has its binaries on Cachix. No FlakeHub Cache (`include-output-paths:
# false`): the maintainer declined it.

name: nix build (packaged artifacts)

on:
  push:
    branches: [main]
    # Docs-only pushes (and backlog claim commits under docs/backlog/claims/)
    # build nothing: skipped only when every changed path matches. See the
    # same filter in ci.yml.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build .#scoot .#scootctl .#scootbg .#scootbar (${{ matrix.system }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          # Free for public repos; the arch the maintainer's Asahi M2 and
          # the aarch64 dev VM actually install on, so prebuilt binaries
          # matter most here. Same packages, same `--version` lines, same
          # scootbar link/closure/override checks: all arch-independent
          # properties of the packaged artifact.
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # Pull from the public cache on every run; push what was built only
      # on a push to main (never on manual dispatches: unreviewed code
      # must not reach a cache users trust). Auth is the org secret
      # CACHIX_AUTH_TOKEN, scoped to this repo; signing is Cachix-managed,
      # so the project holds no private key.
      - uses: cachix/cachix-action@v17
        with:
          name: scoot-sh
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: nix build .#scoot .#scootctl .#scootbg, and run the packaged binaries
        run: |
          nix build .#scoot --out-link result-scoot --print-out-paths
          nix build .#scootctl --out-link result-scootctl --print-out-paths
          nix build .#scootbg --out-link result-scootbg --print-out-paths
          ./result-scoot/bin/scoot --version
          ./result-scootctl/bin/scootctl --version
          ./result-scootbg/bin/scootbg --version

      - name: nix build .#scootbar .#scootbar-demo, what it links, its closure, a feature override
        run: |
          nix build .#scootbar --out-link result-scootbar --print-out-paths
          nix build .#scootbar-demo --out-link result-scootbar-demo --print-out-paths
          ./result-scootbar/bin/scootbar --version
          ./result-scootbar-demo/bin/scootbar --version
          bin=result-scootbar/bin/scootbar
          echo "binary: $(stat -L -c %s "$bin") bytes (stripped)"
          ldd "$bin"
          extra=$(ldd "$bin" | awk '{ print $1 }' | grep -vE '^(linux-vdso|libc\.so|libm\.so|libgcc_s\.so|/)' || true)
          if [ -n "$extra" ]; then
            echo "::error title=packaged scootbar links a library beyond std's::$(echo "$extra" | tr '\n' ' ')"
            exit 1
          fi
          echo "ok: links only what std links"
          nix path-info --recursive --closure-size --human-readable ./result-scootbar
          if nix path-info --recursive ./result-scootbar | grep -iE 'font'; then
            echo "::error title=a font is in scootbar's closure::the bare package takes its font from --font; only scootbar-demo carries one"
            exit 1
          fi
          echo "ok: no font in scootbar's closure"
          nix build --impure --out-link result-scootbar-no-modules --print-out-paths --expr \
            '(builtins.getFlake (toString ./.)).packages.${builtins.currentSystem}.scootbar.override { buildNoDefaultFeatures = true; }'
          ./result-scootbar-no-modules/bin/scootbar --help | grep -F 'built with no modules'

  # Publish the flake to FlakeHub once both arch builds pushed their
  # binaries to Cachix, so a published flake version always has its
  # binaries cached. Pushes to main only (manual dispatches verify the
  # build without publishing it). Auth is GitHub OIDC, no secret.
  publish:
    name: publish flake to FlakeHub (rolling, public)
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Rolling versions count commits (`0.1.<count>+rev-<sha>`); a
          # shallow checkout would miscount.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@v23

      - uses: DeterminateSystems/flakehub-push@v7
        with:
          # `scoot-sh/scoot` is the default: `{org}/{repo}` of this repo.
          visibility: public
          rolling: true
          # No FlakeHub Cache (declined): resolved store paths stay off.
          include-output-paths: false
