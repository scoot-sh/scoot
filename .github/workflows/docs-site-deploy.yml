# Docs site deploy.
#
# Builds `nix build .#docs-site` and publishes the static tree to GitHub
# Pages (Pages source: GitHub Actions; live at
# https://www.scoot.sh/ with `DEPLOY_TARGET = 'www'`
# in site/astro.config.mjs). The `scoot.sh` move is a one-line change to
# that same value plus the DNS/API steps in site/README.md ("Moving to
# scoot.sh"). Not a docs move: `docs/**` is in `push.paths` so the deploy
# tracks the sources the site will be built from once pages move there.
name: Docs site deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'nix/docs-site.nix'
      - '.github/workflows/docs-site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. `cancel-in-progress: false` lets a running deploy
# finish (GitHub's recommendation for Pages: cancelling mid-publish can leave
# a half-deployed site); a newer run waits, and GitHub drops all but the
# newest queued one.
concurrency:
  group: docs-site-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: nix build .#docs-site
        run: nix build -L --out-link site-out .#docs-site

      - name: Upload the static tree
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site-out/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
