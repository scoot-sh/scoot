# scoot releases: the tag-triggered release job
# (docs/backlog/resolved/release-artifacts-done.md, docs/versioning.md).
#
# WHAT IT DOES: pushing a release tag (`v0.2.0`: one tag, the
# repository's one version) builds every binary -- scoot (with `scoot
# msg`), scootbg, scootbar, scootlaunch, scootnotify and
# scoot-globalshortcuts-portal -- and publishes a GitHub Release holding the vendored source
# tarball (`scripts/vendor-release.sh`), portable glibc binaries for
# `x86_64-linux` and `aarch64-linux`, an SBOM (CycloneDX, cargo-cyclonedx),
# `SHA256SUMS`, a keyless build-provenance attestation, and that
# version's CHANGELOG.md section (`scripts/release-notes`) as the notes. No
# manual uploads, no long-lived signing keys, no extra secrets: release
# creation and attestation run on `GITHUB_TOKEN` alone.
#
# WHY THE BINARIES COME FROM CARGO IN A DISTRO CONTAINER, NOT `nix
# build`: a `nix build` binary carries a `/nix/store/...` interpreter and
# RUNPATH, so it runs only where that store exists (measured: the
# packaged `scootbar` fails on plain bookworm with "no such file or
# directory", while the container build prints its `--version` on
# bookworm, trixie and fedora 43 alike; see the ticket's record). The
# release binary must run on a stock distro, so it is built with cargo
# `--locked --offline` from the vendored tree inside
# `debian:bookworm-slim` (glibc floor 2.36, stated and asserted below),
# with the stock toolchain of that base plus a pinned rustup toolchain
# (bookworm's rustc is far below the workspace `rust-version` floor of
# 1.88, which the tree's let-chains need). Nix
# stays the reproducible path for Nix users: every tag is on main, and
# main's binaries are already on Cachix with the flake on FlakeHub
# (`.github/workflows/nix-build.yml`).
#
# WHO TAGS, AND HOW A RUN STARTS: two paths, one gate.
# - The release PR. release-plz (`release-plz.yml`) keeps a PR open that
#   bumps the workspace version and CHANGELOG.md; merging it makes
#   release-plz create `vX.Y.Z` with GITHUB_TOKEN. A tag made that way
#   starts no `push` run (GitHub starts no workflow for GITHUB_TOKEN
#   events), so release-plz.yml then dispatches this workflow ON the tag
#   (`gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z -f
#   dry_run=false`): workflow_dispatch is the documented exception that
#   always starts a run.
# - A maintainer pushing a `v*` tag by hand (the first one, v0.2.0, is cut
#   that way): the `push: tags` trigger below.
# Both resolve the same tag through the same gates, share one
# concurrency group per tag (so they queue, never overlap), and a run
# that finds the release already complete stops green with a notice
# instead of publishing again: whichever path runs second does nothing.
# A dispatch that would publish (`dry_run: false`) must run on the tag
# itself (`--ref vX.Y.Z`): from a branch, it is refused before anything
# builds.
#
# GATES (all in `scripts/release-resolve`, unit-tested in
# `scripts/test_release_resolve.py`): the tag is `vX.Y.Z`; its version
# equals the `[workspace.package] version` at the tagged commit, and
# every crate there inherits it; the tag exists and its commit is on
# `origin/main`; a release holding every expected
# asset refuses a re-publish, while an incomplete one resumes, so a
# re-run of a failed run converges instead of duplicating. Dispatch
# takes the same gates: `tag` must exist and point at main.
#
# DRY RUN: `workflow_dispatch` with `dry_run: true` (the default, from any
# ref) runs
# resolve, vendor, both arch builds, SBOM, checksums and the changelog,
# then prints what it would publish and stops. A dry run attests nothing
# and creates no release; it still uploads the run's own build artifacts
# (7-day retention). New workflows cannot be
# dispatched until they are on main, so the first dry run happens after
# merge; until then the lint job below plus local runs are the proof.
#
# POST-PUBLISH VERIFICATION (`verify` job): after a real publish, each
# arch downloads the release's own assets from GitHub, checks every file
# against the published SHA256SUMS and its keyless build-provenance
# attestation, and runs each binary (`--version` names the release, the
# bar's and the launcher's `--check`, the compositor's default-config
# render) on bare Ubuntu and Debian containers. It never runs on
# pull requests or dry runs. `workflow_dispatch` with `verify_only:
# true` and a `tag` runs only resolve plus this job, from any ref, to
# test it read-only against an existing release (e.g. v0.4.0); it
# publishes and builds nothing.
#
# RECOVERY: re-run the failed workflow run (same tag): the gates resume
# an incomplete release and skip a complete one. If a published
# release is wrong, the maintainer deletes the release and the tag and
# re-cuts (`docs/versioning.md` plus the site's "cut a release" page).
#
# TRIGGERS (the CLAUDE.md rule: no always-run job; docs-only pushes
# start nothing): tag pushes run the pipeline; `pull_request` runs only
# the lint job and only when the release tooling changes (this file,
# release-plz.yml and its config, the release scripts) or what a release
# PR changes (Cargo.toml, Cargo.lock, CHANGELOG.md, packaging/); a
# dispatch with an empty `tag` runs only the lint job (release-plz.yml
# does that on its PR's branch, whose pull_request run waits for
# approval); a dispatch with `verify_only: true` and a tag runs only
# resolve plus the verify job (read-only: no build, no publish); a
# push to main never reaches this workflow (no `branches: [main]`
# trigger), and tag pushes always contain the release commit, so no
# paths filter is needed on the tag trigger.
#
# PINS: every third-party action is pinned by commit SHA (tag in a
# trailing comment), the publishing-workflow convention (`nix-build.yml`
# says why: these runs mint the artifacts users trust). The distro base
# (`debian:bookworm-slim`) and the rustup toolchain (`1.97.0`) are
# pinned by tag and version in the build steps; the glibc they produce
# is asserted, not assumed. `nix shell --inputs-from .` tools
# (cargo-cyclonedx, actionlint) resolve through this repo's own
# `flake.lock`.
#
# PERMISSIONS: top-level `read`; `contents: write` (release create and
# upload), `id-token: write` plus `attestations: write` (provenance)
# only on the publish job.

name: release (tag-triggered)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-plz.yml'
      - 'release-plz.toml'
      # What a release PR changes (the workspace version, the lockfile,
      # the changelog the notes come from, the packaging bump), so the
      # release tooling is checked against it.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - 'packaging/**'
      - 'scripts/release-resolve'
      - 'scripts/release-notes'
      - 'scripts/workspace-version'
      - 'scripts/sync-fuzz-locks'
      - 'scripts/sync-packaging-versions'
      - 'scripts/test_sync_packaging_versions.py'
      - 'scripts/test_release_resolve.py'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Must exist and point at main. To publish (dry_run false), run on that tag: --ref v0.2.0. Empty: run only the lint job on the dispatched ref (what release-plz does for its PR).'
        required: false
        default: ''
      dry_run:
        description: 'Build everything, publish nothing (any ref). false publishes, and only on the tag itself.'
        required: true
        default: true
        type: boolean
      verify_only:
        description: 'Read-only: download the tag release and verify it (checksums, attestations, binary runs). Publishes nothing, builds nothing. Needs tag; runs from any ref.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# A publish must never be cancelled halfway (half-uploaded assets read
# as complete by nothing: the gates resume them, but do not leave them).
#
# One group per TAG, not per ref: the tag push and a dispatch on the same
# tag (release-plz's path) land in one queue, whichever ref started them.
# Pull request runs (lint only) keep a group per PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The workflow's own CI: actionlint over this file plus the release
  # tools' unit tests. Runs on pull requests that touch the release
  # tooling, and nowhere else.
  lint:
    name: Release tooling (actionlint + resolve tests)
    # Also on a dispatch without a tag: release-plz.yml runs this on the
    # release PR's branch, whose own pull_request run waits for approval.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: actionlint (pinned through this repo's flake.lock)
        run: nix shell --inputs-from . nixpkgs#actionlint --command actionlint .github/workflows/release.yml .github/workflows/release-plz.yml

      - name: Release workflow guards (single-path artifacts, no inline context)
        run: |
          python3 - <<'EOF'
          import re, sys
          path = ".github/workflows/release.yml"
          text = open(path).read()
          # 1. No multi-path upload: every upload-artifact path must be a single path
          # (multiple path entries restore under their least common ancestor,
          # so consumers cannot predict the layout; see the review of #498).
          if re.search(r"(?m)^\s*path:\s*\|", text):
              print("::error title=Multi-path upload::release.yml must not contain a block path (upload one staged directory per artifact).")
              sys.exit(1)
          # 2. No direct github/inputs/steps interpolation inside run blocks
          # (pass values through env instead; needs/matrix/runner remain allowed).
          # Whitespace-tolerant and covering every `run:` scalar style (`|`,
          # `|-`, `>`, and a single-line value). Built without a literal
          # expression opener so this guard does not trip itself.
          opener = chr(36) + chr(123) + chr(123)
          forbidden = re.compile(re.escape(opener) + r"\s*(steps|github|inputs)\.")
          lines = text.splitlines()
          in_run = False
          run_indent = None
          bad = []
          for i, line in enumerate(lines, 1):
              m = re.match(r"^(\s*)(?:-\s*)?run:\s*(.*)$", line)
              if m:
                  rest = m.group(2).strip()
                  run_indent = len(m.group(1)) + (2 if line.lstrip().startswith("- ") else 0)
                  if rest and rest[0] not in "|>":
                      if forbidden.search(rest):
                          bad.append(f"{i}: inline run value: {line.strip()}")
                      in_run = False
                  else:
                      in_run = True
                  continue
              if in_run:
                  if line.strip() == "" or len(line) - len(line.lstrip()) > run_indent:
                      if forbidden.search(line):
                          bad.append(f"{i}: in run block: {line.strip()}")
                  else:
                      in_run = False
          if bad:
              print("::error title=Inline context in run::pass github/inputs/steps values through env instead.")
              for b in bad:
                  print(b)
              sys.exit(1)
          # 3. Every upload-artifact step must say include-hidden-files: true
          # (v4.4+ drops dot-files by default; the vendor tree has .cargo/).
          steps = re.split(r"(?m)^\s*-\s+(?=name:|uses:)", text)
          for st in steps:
              code = re.sub(r"(?m)\s*#.*$", "", st)  # a comment must not satisfy the check
              if "actions/upload-artifact@" in st and "include-hidden-files: true" not in code:
                  print("::error title=Hidden files::every upload-artifact step in release.yml needs include-hidden-files: true.")
                  sys.exit(1)
          print("guards ok: single-path uploads, hidden files included, no inline github/inputs/steps in run")
          EOF

      - name: release tool tests (release-resolve, workspace-version, release-notes, packaging sync)
        run: |
          python3 scripts/test_release_resolve.py
          python3 scripts/test_sync_packaging_versions.py

  # Parse the tag and run every refusal gate. Its outputs drive the rest
  # of the pipeline; a refusal fails the run before anything builds.
  resolve:
    name: Resolve and gate the tag
    # A tag push, or a dispatch that names a tag (an empty one is lint only).
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      binaries: ${{ steps.resolve.outputs.binaries }}
      assets: ${{ steps.resolve.outputs.assets }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      complete: ${{ steps.resolve.outputs.complete }}
      verify_only: ${{ steps.resolve.outputs.verify_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: The tag under test
        id: tag
        env:
          PUSH_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          tag="${PUSH_TAG:-$INPUT_TAG}"
          test -n "$tag" || { echo "::error title=No tag to release::dispatch needs the 'tag' input."; exit 1; }
          # A dispatch that publishes runs on the tag itself, so the
          # workflow, the scripts and the gates are the tag's own: from a
          # branch, only a dry run.
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN_INPUT" != true ]; then
            if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error title=Publishing dispatch not on its tag::dry_run=false must run with --ref $tag (this run is on $GITHUB_REF_TYPE '$GITHUB_REF_NAME'). From a branch, dispatch a dry run."
              exit 1
            fi
          fi
          echo "value=$tag" >>"$GITHUB_OUTPUT"

      - name: scripts/release-resolve (every refusal gate)
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_TO_RESOLVE: ${{ steps.tag.outputs.value }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          # A dispatch input arrives as a string ("true", not true), and
          # is empty on push events: normalize to true/false here, once,
          # so the jobs below compare one string output.
          VERIFY_ONLY_INPUT: ${{ inputs.verify_only }}
        run: |
          # --complete-ok: a release that already holds every asset is not
          # an error here but a finished job (the tag push and release-plz's
          # dispatch can both reach the same tag); the plan says so and the
          # jobs below skip.
          plan=$(scripts/release-resolve --json --complete-ok "$TAG_TO_RESOLVE")
          echo "$plan"
          {
            echo "tag=$(printf '%s' "$plan" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')"
            echo "version=$(printf '%s' "$plan" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            echo "binaries=$(printf '%s' "$plan" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["binaries"]))')"
            echo "assets=$(printf '%s' "$plan" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["assets"]))')"
            echo "complete=$(printf '%s' "$plan" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["complete"]).lower())')"
            if [ "$EVENT_NAME" = push ]; then echo "dry_run=false"; else echo "dry_run=$DRY_RUN_INPUT"; fi
            if [ "$VERIFY_ONLY_INPUT" = true ]; then echo "verify_only=true"; else echo "verify_only=false"; fi
          } >>"$GITHUB_OUTPUT"
          if printf '%s' "$plan" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)["complete"] else 1)'; then
            echo "::notice title=Already released::$TAG_TO_RESOLVE already holds every asset; nothing to build or publish."
          fi

  # The vendored source tarball plus the SBOM: arch-independent, staged
  # once from the tag. The portable builds below compile this exact
  # tree, so the tarball users unpack is the tree the binaries came
  # from. (The staging compile check `--check-offline` does not run
  # here: both arch builds below already build this tree offline, which
  # is the same proof without a third compile.)
  vendor:
    name: Vendored tarball + SBOM
    needs: resolve
    if: github.event_name != 'pull_request' && needs.resolve.outputs.complete != 'true' && needs.resolve.outputs.verify_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Stage the tarball
        # In the dev shell, which has the tools the script checks for
        # (cargo-deny among them), as packaging.yml's offline check does.
        shell: nix develop --command bash -euo pipefail {0}
        env:
          RESOLVE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          # Named by the version (`scoot-0.2.0-vendored.tar.gz`), the name
          # the RPM specs' Source0 downloads.
          scripts/vendor-release.sh --out "$RUNNER_TEMP/vendor-release" --label "$RESOLVE_VERSION"
          ls -l "$RUNNER_TEMP/vendor-release"

      - name: SBOM (CycloneDX from the lockfile, cargo-cyclonedx)
        env:
          RESOLVE_VERSION: ${{ needs.resolve.outputs.version }}
          RESOLVE_BINARIES: ${{ needs.resolve.outputs.binaries }}
        run: |
          # Union SBOM over every shipped binary: a release ships scoot,
          # scootbg, scootbar, scootlaunch, scootnotify and
          # scoot-globalshortcuts-portal, and one crate's SBOM would omit the
          # others' dependencies (e.g. scootbg's image-webp/zune-*/
          # byteorder-lite decoders). cargo-cyclonedx emits crates/*/sbom.json
          # in one run (the manifest path only picks the workspace, as it
          # did per package before); merge the shipped binaries'
          # components, deduplicated by bom-ref, into one file.
          nix shell --inputs-from . nixpkgs#cargo-cyclonedx --command \
            cargo cyclonedx -f json --override-filename sbom \
              --manifest-path crates/scoot/Cargo.toml
          python3 - <<'EOF'
          import json, os
          version = os.environ["RESOLVE_VERSION"]
          wanted = os.environ["RESOLVE_BINARIES"].split()
          merged = {}
          base = None
          for name in wanted:
              path = f"crates/{name}/sbom.json"
              try:
                  with open(path) as f:
                      data = json.load(f)
              except FileNotFoundError:
                  continue
              if base is None:
                  base = data
              for comp in data.get("components", []):
                  key = comp.get("bom-ref") or (comp.get("name", ""), comp.get("version", ""))
                  if isinstance(key, tuple):
                      key = f"{key[0]}@{key[1]}"
                  merged[key] = comp
          assert base is not None, f"no SBOM found for {wanted}"
          base["components"] = [merged[k] for k in sorted(merged)]
          runner_temp = os.environ["RUNNER_TEMP"]
          out = f"{runner_temp}/sbom-scoot-{version}.cyclonedx.json"
          with open(out, "w") as f:
              json.dump(base, f, indent=2)
          print(base.get("bomFormat"), base.get("specVersion"), len(base["components"]), "components", f"from {wanted}")
          EOF
          rm -f crates/*/sbom.json
          ls -l "$RUNNER_TEMP"/sbom-*.cyclonedx.json

      - name: Stage the vendor artifact (single directory)
        run: |
          STAGE="$RUNNER_TEMP/stage-vendor"
          mkdir -p "$STAGE"
          cp -a "$RUNNER_TEMP"/vendor-release/scoot-*-vendored/source "$STAGE/source"
          test -f "$STAGE/source/.cargo/config.toml" || { echo "::error title=Staged source has no .cargo/config.toml::vendor-release.sh did not stage intact."; exit 1; }
          cp "$RUNNER_TEMP"/vendor-release/*.tar.gz "$STAGE/"
          cp "$RUNNER_TEMP"/sbom-*.cyclonedx.json "$STAGE/"
          ls -l "$STAGE"

      - name: Upload the staged source, tarball and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor
          path: ${{ runner.temp }}/stage-vendor
          # The staged tree carries `source/.cargo/config.toml`, and
          # upload-artifact v4.4+ drops hidden files unless told otherwise
          # (the build's intact check would then fail on every run).
          include-hidden-files: true
          retention-days: 7

  # One portable glibc build per architecture, on that architecture's
  # native runner (no cross, no emulation): cargo `--locked --offline`
  # from the staged source inside `debian:bookworm-slim`, so the glibc
  # floor is the base's (2.36), stated, not accidental.
  build:
    name: Portable binaries (${{ matrix.arch }})
    needs: [resolve, vendor]
    if: github.event_name != 'pull_request' && needs.resolve.outputs.complete != 'true' && needs.resolve.outputs.verify_only != 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64-linux
          # Free for public repos; the same runner the packaged
          # aarch64 builds already use (nix-build.yml).
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Pinned together: the base sets the glibc floor, the toolchain
      # must clear the workspace floor (1.88, for the tree's let-chains);
      # bookworm's own rustc does not, so this pin is load-bearing.
      DISTRO_IMAGE: debian:bookworm-slim
      RUST_TOOLCHAIN: 1.97.0
    steps:
      - name: Download the staged source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor
          path: ${{ runner.temp }}/vendor

      - name: Build --release --locked --offline in the distro container
        run: |
          src="$RUNNER_TEMP/vendor/source"
          test -f "$src/.cargo/config.toml" || { echo "::error title=Staged source has no .cargo/config.toml::the vendor artifact did not download intact."; exit 1; }
          # Create it as the runner: docker would create the bind mount as root,
          # and the Checksums step could not write SHA256SUMS into it.
          mkdir -p "$RUNNER_TEMP/dist"
          docker run --rm \
            -v "$src:/src:ro" -v "$RUNNER_TEMP/dist:/out" \
            -e CARGO_NET_OFFLINE=true -e CARGO_TARGET_DIR=/tmp/target \
            "$DISTRO_IMAGE" bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq curl ca-certificates build-essential pkg-config \
                libseat-dev libinput-dev libxkbcommon-dev libudev-dev \
                libpixman-1-dev libwayland-dev wayland-protocols
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain "$0" --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              echo "--- toolchain and glibc floor ---"
              rustc --version
              ldd --version | sed -n 1p
              cd /src
              # Unquoted on purpose: the resolve output is allowlist-safe
              # (scoot/scootbg/scootbar/scootlaunch/scootnotify from scripts/release-resolve).
              for bin in ${{ needs.resolve.outputs.binaries }}; do
                cargo build --release --locked --offline -p "$bin"
                cp "/tmp/target/release/$bin" \
                  "/out/${bin}-${{ needs.resolve.outputs.version }}-${{ matrix.arch }}"
              done
              ls -l /out/
            ' "$RUST_TOOLCHAIN"

      # The floor the release promises: every binary runs on the base
      # it was built on (bookworm, glibc 2.36) with only runtime
      # libraries installed -- no toolchain, no -dev packages -- so a
      # user installing the documented dependencies gets a binary that
      # starts. scoot needs its five system libraries (the ldd-derived
      # list in the site packaging page); scootlaunch needs the keyboard
      # one; the others must start bare (scootnotify links nothing past
      # the C library, like the bar and the wallpaper daemon)
      # (scoot-[0-9]* names only the compositor, as the old scoot-* did:
      # shell globs need the literal `scoot-`, so scootbg-*, scootbar-*,
      # scootlaunch-* and scootnotify-* also start with scoot: the first
      # three must run with nothing installed, the last with only
      # libxkbcommon0).
      - name: The binaries start on the bare base
        run: |
          ls -l "$RUNNER_TEMP/dist"
          docker run --rm -v "$RUNNER_TEMP/dist:/dist:ro" "$DISTRO_IMAGE" bash -euo pipefail -c '
            apt-get update -qq
            for bin in /dist/*; do
              case "$(basename "$bin")" in
                scoot-[0-9]*) apt-get install -y -qq libseat1 libinput10 libxkbcommon0 libudev1 libpixman-1-0 >/dev/null ;;
                scootlaunch-[0-9]*) apt-get install -y -qq libxkbcommon0 >/dev/null ;;
              esac
              "$bin" --version
            done
          '

      - name: Checksums and stage (single directory)
        run: |
          (cd "$RUNNER_TEMP/dist" && sha256sum -- * > "SHA256SUMS-${{ matrix.arch }}")
          cat "$RUNNER_TEMP/dist/SHA256SUMS-${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/stage-dist"
          cp -a "$RUNNER_TEMP/dist/." "$RUNNER_TEMP/stage-dist/"
          ls -l "$RUNNER_TEMP/stage-dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage-dist
          include-hidden-files: true
          retention-days: 7

  # Assemble, attest and publish (or print the dry-run summary). Runs
  # after both arch builds and the vendor job, so a red build never
  # reaches a release.
  publish:
    name: Publish the GitHub Release (or dry-run it)
    needs: [resolve, vendor, build]
    if: github.event_name != 'pull_request' && needs.resolve.outputs.complete != 'true' && needs.resolve.outputs.verify_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      # Set only by a real publish below (the dry run exits before it):
      # the verify job's gate, which cannot use needs.publish.result
      # (referencing a skipped job's result fails its whole condition).
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download every artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor
          path: ${{ runner.temp }}/rel/vendor

      - name: Download the x86_64 binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-x86_64-linux
          path: ${{ runner.temp }}/rel/x86_64

      - name: Download the aarch64 binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-aarch64-linux
          path: ${{ runner.temp }}/rel/aarch64

      # Every file the resolve planned must be present exactly once, and
      # every binary must still match the checksum its own arch build
      # recorded. Only then is SHA256SUMS written (sorted: deterministic).
      - name: Assemble and verify the file set
        run: |
          mkdir -p dist
          cp "${{ runner.temp }}/rel/vendor/"*.tar.gz dist/
          cp "${{ runner.temp }}/rel/vendor/"*.cyclonedx.json dist/
          cp "${{ runner.temp }}/rel/x86_64/"scoot* "${{ runner.temp }}/rel/aarch64/"scoot* dist/
          # SHA256SUMS is planned too, but written below from the files
          # checked here, so it is the one asset checked afterwards.
          for asset in ${{ needs.resolve.outputs.assets }}; do
            [ "$asset" = SHA256SUMS ] && continue
            test -f "dist/$asset" || { echo "::error title=Missing release asset::$asset was planned but not assembled."; exit 1; }
          done
          (cd dist && sha256sum -c "${{ runner.temp }}/rel/x86_64/SHA256SUMS-x86_64-linux")
          (cd dist && sha256sum -c "${{ runner.temp }}/rel/aarch64/SHA256SUMS-aarch64-linux")
          (cd dist && sha256sum -- * | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          test -f dist/SHA256SUMS || { echo "::error title=Missing release asset::SHA256SUMS"; exit 1; }
          ls -l dist/

      - name: Release notes (this version's CHANGELOG.md section)
        run: |
          {
            echo "## scoot ${{ needs.resolve.outputs.version }}"
            echo
            echo "Every binary at one version: scoot (with \`scoot msg\`), scootbg, scootbar, scootlaunch, scootnotify and scoot-globalshortcuts-portal."
            echo
            scripts/release-notes '${{ needs.resolve.outputs.version }}'
            echo
            echo "Built from \`$(
              git rev-parse --short '${{ needs.resolve.outputs.tag }}^{commit}')\` on main;"
            echo "verify a download on the site's [releases page](https://www.scoot.sh/reference/releases/)."
          } >"$RUNNER_TEMP/NOTES.md"
          cat "$RUNNER_TEMP/NOTES.md"

      # Keyless build provenance over every file (no signing key in
      # secrets, nothing for the maintainer to rotate): users check it
      # with `gh attestation verify <file> --owner scoot-sh
      # --signer-workflow scoot-sh/scoot/.github/workflows/release.yml`.
      # Pinning the signer workflow matters: --owner alone accepts a
      # provenance attestation minted by any workflow in the org.
      # Skipped in dry runs (an attestation is a public claim; a dry run makes
      # none).
      - name: Attest the file set
        if: needs.resolve.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish (or print the dry-run summary)
        id: publish
        run: |
          if [ '${{ needs.resolve.outputs.dry_run }}' = true ]; then
            echo "dry run: would publish '${{ needs.resolve.outputs.tag }}' with these files:"
            (cd dist && sha256sum -- *)
            echo "dry run: no release created, nothing attested (the run's own artifacts were uploaded)."
            exit 0
          fi
          tag='${{ needs.resolve.outputs.tag }}'
          if ! gh release view "$tag" --json name >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" --notes-file "$RUNNER_TEMP/NOTES.md"
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
          echo "published=true" >>"$GITHUB_OUTPUT"

  # Post-publish proof: download the release's own assets from GitHub,
  # check every file against the published SHA256SUMS and its keyless
  # build-provenance attestation, and run each binary on bare distro
  # containers. Runs after a real publish (a tag push, or a dispatch
  # with dry_run=false on the tag itself), and on an explicit
  # verify-only dispatch (read-only: it downloads and checks from any
  # ref, and builds and publishes nothing). Never on pull requests and
  # never on dry runs: there is nothing published to check.
  #
  # A missing or tampered file, a file with no attestation from this
  # workflow, a --version that does not name the release version, or a
  # failed --check fails the run with the file and the reason named.
  # The release ships six binaries (scoot, scootbg, scootbar,
  # scootlaunch, scootnotify and scoot-globalshortcuts-portal), each covered below.
  verify:
    name: Verify the published release (${{ matrix.arch }})
    needs: [resolve, publish]
    # `always()` because publish is skipped in verify-only mode, and a
    # skipped need auto-skips the dependent job without evaluating its
    # condition. The outputs still decide: only a fresh publish (its
    # `published` output below), or an explicit verify-only dispatch on
    # a resolved tag, runs this job. (On pull requests resolve never
    # runs, so its outputs are empty and both sides are false; on a dry
    # run publish exits before setting `published`.)
    if: >-
      always() && (needs.resolve.outputs.verify_only == 'true' ||
        needs.publish.outputs.published == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64-linux
          # Free for public repos; the same runner the release
          # aarch64 builds already use.
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The `gh` calls below infer the repository from this checkout
      # (no git history is used here).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release's assets
        env:
          VERIFY_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download "$VERIFY_TAG" --dir "$RUNNER_TEMP/verify"
          # Release assets carry no mode: make the binaries executable
          # (content untouched, so the checksums below still prove them).
          chmod +x "$RUNNER_TEMP"/verify/scoot*-*-linux
          ls -l "$RUNNER_TEMP/verify"

      # SHA256SUMS lists every published file, so this also proves the
      # set is complete: a missing file fails the check by name.
      - name: Every file matches the published SHA256SUMS
        run: |
          (cd "$RUNNER_TEMP/verify" && sha256sum -c SHA256SUMS)

      # Keyless build provenance over every file (what the publish job
      # attested): users check the same with `gh attestation verify
      # <file> --owner <owner> --signer-workflow
      # <owner>/<repo>/.github/workflows/release.yml`.
      - name: Every file carries this workflow's attestation
        env:
          VERIFY_REPO: ${{ github.repository }}
        run: |
          owner="${VERIFY_REPO%%/*}"
          name="${VERIFY_REPO#*/}"
          fail=0
          for f in "$RUNNER_TEMP"/verify/*; do
            base="$(basename "$f")"
            if gh attestation verify "$f" --owner "$owner" \
              --signer-workflow "$owner/$name/.github/workflows/release.yml"; then
              echo "ok: provenance verified for $base"
            else
              echo "::error title=No build provenance for $base::gh attestation verify failed: the file is missing, tampered, or was not attested by $owner/$name/.github/workflows/release.yml."
              fail=1
            fi
          done
          exit "$fail"

      # Each binary on a bare Ubuntu and a bare Debian container: the
      # stock image plus the documented runtime libraries (five system
      # libraries for the compositor, the keyboard one for the
      # launcher), one DejaVu font
      # for the bar check, which loads a font exactly as a start
      # does, and a session bus for the notification daemon
      # check and the portal backend start. No toolchain, no -dev packages.
      #
      # The loop covers the binaries the release holds (found by name),
      # not a fixed list: an old release predates newer binaries
      # (v0.3.1 has no scootlaunch, and no tag before this one holds
      # scootnotify or the portal backend), and a new one may add more. A
      # release missing a binary it should hold still fails loudly --
      # one step earlier, at SHA256SUMS, which lists every published
      # file.
      - name: Each binary reports the release and passes its check
        env:
          VERIFY_VERSION: ${{ needs.resolve.outputs.version }}
          VERIFY_ARCH: ${{ matrix.arch }}
        run: |
          dir="$RUNNER_TEMP/verify"
          for image in ubuntu:24.04 debian:bookworm-slim; do
            echo "--- $image ($VERIFY_ARCH) ---"
            docker run --rm \
              -v "$dir:/rel:ro" \
              -e VERIFY_VERSION -e VERIFY_ARCH -e IMAGE="$image" \
              "$image" bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq libseat1 libinput10 libxkbcommon0 libudev1 libpixman-1-0 fonts-dejavu-core dbus
              count=0
              for f in /rel/*-"$VERIFY_ARCH"; do
                base="$(basename "$f")"
                out=$("$f" --version)
                echo "$out"
                case "$out" in
                  *"$VERIFY_VERSION"*) ;;
                  *) echo "::error title=$base --version is not $VERIFY_VERSION::got: $out"; exit 1 ;;
                esac
                case "$base" in
                  scootbar-*)
                    "$f" daemon --check \
                      || { echo "::error title=$base daemon --check failed::the bar does not validate its built-in defaults."; exit 1; }
                    echo "ok: $base daemon --check prints ok" ;;
                  scootlaunch-*)
                    "$f" --check \
                      || { echo "::error title=$base --check failed::the launcher does not validate its built-in defaults."; exit 1; }
                    echo "ok: $base --check passes" ;;
                  scootnotify-*)
                    # On a session bus (the daemon is headless-capable:
                    # with no compositor the cards wait and the bus
                    # still serves, so the bus alone proves it starts).
                    dbus-run-session -- "$f" daemon --check \
                      || { echo "::error title=$base daemon --check failed::the daemon does not validate its built-in defaults."; exit 1; }
                    echo "ok: $base daemon --check prints valid" ;;
                  scootbg-*)
                    echo "ok: $base reports $VERIFY_VERSION (--version is its whole probe)" ;;
                  scoot-globalshortcuts-portal-*)
                    "$f" --help > /dev/null \
                      || { echo "::error title=$base --help failed::the portal backend does not print its usage."; exit 1; }
                    echo "ok: $base prints its usage" ;;
                  scoot-*)
                    "$f" --print-default-config > /dev/null \
                      || { echo "::error title=$base --print-default-config failed::the compositor binary does not render its default config."; exit 1; }
                    echo "ok: $base renders its default config" ;;
                  *)
                    echo "ok: $base reports $VERIFY_VERSION (no deeper probe known)" ;;
                esac
                count=$((count + 1))
              done
              test "$count" -gt 0 || { echo "::error title=No binaries downloaded for $VERIFY_ARCH::nothing matched."; exit 1; }
              echo "ok: every --version names $VERIFY_VERSION ($count binaries on $IMAGE)"
              '
          done
