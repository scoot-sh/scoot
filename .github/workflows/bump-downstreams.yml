# Bump try-scoot and scoot-iso when a scoot release is published.
#
# WHAT IT DOES: when scoot publishes `vX.Y.Z`, open one PR in each of
# scoot-sh/try-scoot and scoot-sh/scoot-iso moving their scoot pin to
# the new tag (flake input + lock, plus the ISO's installer target
# flake and its patch-consistency constants). The per-repo edits run
# through `scripts/bump-downstream`, so the workflow stays thin and
# every bump is reproducible by hand. Never auto-merges. Skips
# prereleases.
#
# WHY TWO TRIGGERS, AND WHY release.yml DISPATCHES THIS WORKFLOW:
# a `release: published` run only starts when the release was created
# with a token that triggers workflows. release.yml creates the
# release with GITHUB_TOKEN (`gh release create`), and workflows
# started by GITHUB_TOKEN do not trigger new workflow runs -- so the
# normal release path would never reach a `release: published` trigger
# here. This is GitHub-documented ("Triggering a workflow from a
# workflow": events triggered by GITHUB_TOKEN create no new runs, with
# the exception of workflow_dispatch and repository_dispatch;
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow).
# release-plz.yml already relies on that exact exception to dispatch
# release.yml. release.yml's `dispatch-downstreams` job does the same
# for this workflow (`gh workflow run bump-downstreams.yml --ref main
# -f tag=<tag>` with GITHUB_TOKEN), which always starts a run. The
# `release: published` trigger stays for releases cut by hand (UI or a
# PAT, which do trigger), and `workflow_dispatch` (input `tag`) covers
# re-runs and testing.
#
# TOKEN: cross-repo writes need more than GITHUB_TOKEN (it cannot push
# outside this repo). Use secret DOWNSTREAM_BUMP_TOKEN: a fine-grained
# PAT (or GitHub App token) with contents + pull-requests write on
# scoot-sh/try-scoot and scoot-sh/scoot-iso. The job fails with a clear
# message when it is unset and never prints it. A PR opened with this
# token runs each repo's CI; a PR opened with GITHUB_TOKEN would get no
# checks.
#
# IDEMPOTENT: the branch is `ci/bump-scoot-<tag>`; if it or an open PR
# for that tag already exists, the run updates it instead of opening a
# duplicate.
#
# MANUAL FALLBACK (no secret, or a red run): run scripts/bump-downstream
# against local clones, push, and open the PRs by hand (see the site's
# "cut a release" page).

name: bump downstreams on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Scoot release tag to bump downstreams to (e.g. v0.6.3). Must exist and point at main.'
        required: true

permissions:
  contents: read

concurrency:
  group: bump-downstreams-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the tag
    if: github.repository == 'scoot-sh/scoot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: The tag under test
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            tag="$RELEASE_TAG"
            prerelease="$RELEASE_PRERELEASE"
          else
            tag="$INPUT_TAG"
            prerelease=false
            case "$tag" in
              *-*) prerelease=true ;;
            esac
          fi
          test -n "$tag" || { echo "::error title=No tag to bump to::dispatch needs the 'tag' input."; exit 1; }
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error title=Not a release tag::$tag is not vX.Y.Z."; exit 1 ;;
          esac
          echo "value=$tag" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  bump:
    name: Bump ${{ matrix.repo }} to ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: github.repository == 'scoot-sh/scoot' && needs.resolve.outputs.prerelease != 'true'
    strategy:
      fail-fast: false
      matrix:
        repo: [try-scoot, scoot-iso]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: The bump token must exist
        env:
          BUMP_TOKEN_SET: ${{ secrets.DOWNSTREAM_BUMP_TOKEN != '' }}
        run: |
          if [ "$BUMP_TOKEN_SET" != true ]; then
            echo "::error title=Missing DOWNSTREAM_BUMP_TOKEN::create a fine-grained PAT (or GitHub App token) with contents and pull-requests write on scoot-sh/try-scoot and scoot-sh/scoot-iso, and store it as this repo's DOWNSTREAM_BUMP_TOKEN secret. See the site's 'cut a release' page. The token value itself is never printed."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: scoot

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: scoot-sh/${{ matrix.repo }}
          token: ${{ secrets.DOWNSTREAM_BUMP_TOKEN }}
          path: downstream

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Bump the pin
        env:
          BUMP_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          ./scoot/scripts/bump-downstream downstream "$BUMP_TAG"

      - name: Open or update the downstream PR
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_BUMP_TOKEN }}
          BUMP_TAG: ${{ needs.resolve.outputs.tag }}
          BUMP_REPO: ${{ matrix.repo }}
        run: |
          branch="ci/bump-scoot-$BUMP_TAG"
          cd downstream
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice title=Already current::$BUMP_REPO already pins $BUMP_TAG; nothing to open."
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout -B "$branch"
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit --quiet -m "chore: bump scoot pin to $BUMP_TAG"
          git push --quiet --force-with-lease origin "HEAD:$branch"
          title="chore: bump scoot pin to $BUMP_TAG"
          body="Bump the scoot pin to $BUMP_TAG (scoot-sh/scoot release).

          Done by scripts/bump-downstream: flake input tag, \`nix flake lock --update-input scoot\`, and (scoot-iso) the installer target flake plus the patch-consistency constants. Review the lock diff and the target render before merging; do not auto-merge."
          if gh pr view "$branch" --repo "scoot-sh/$BUMP_REPO" >/dev/null 2>&1; then
            gh pr edit "$branch" --repo "scoot-sh/$BUMP_REPO" --title "$title" --body "$body"
            echo "::notice title=Downstream PR updated::scoot-sh/$BUMP_REPO $branch tracks $BUMP_TAG."
          else
            gh pr create --repo "scoot-sh/$BUMP_REPO" --head "$branch" --base main --title "$title" --body "$body"
            echo "::notice title=Downstream PR opened::scoot-sh/$BUMP_REPO $branch tracks $BUMP_TAG."
          fi
