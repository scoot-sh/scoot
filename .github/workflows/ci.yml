# scoot CI -- the floor under this project's manual verification, not a
# replacement for it. `CLAUDE.md`'s independent-review gate is unchanged by
# this file: a green check is evidence the tests passed, not evidence the
# change is right.
#
# --------------------------------------------------------------------------
# WHAT THIS CANNOT COVER
# --------------------------------------------------------------------------
# A GitHub runner has no seat, no VT, no /dev/dri and no GPU, so none of the
# following is exercised here. Every one of them stays a manual run on the
# dev VM (`vm/README.md`) or on real Apple Silicon (`Asahi.md`):
#
#   * `--tty` -- the entire DRM/KMS backend: mode setting, VT switching,
#     session pause/resume through libseat, connector hotplug, GPU selection.
#     Nothing below starts the compositor on a real seat.
#   * Any GPU *hardware* path -- GPU scanout, and importing a dmabuf a real
#     GPU produced. Two halves of that are worth stating exactly, because
#     "no GPU coverage" would be as misleading as claiming it:
#       - `render/tests.rs`'s GLES tests do run here, but against Mesa's
#         software rasteriser (see "Resolve a software EGL" below), never a
#         driver. No run here starts a live compositor with `--renderer
#         gles`; that is `RENDERER=gles scripts/smoke-test.sh` on the dev VM.
#       - The dmabuf suite's hardware tests skip *themselves* where there is
#         no usable `/dev/udmabuf` (they print "skipped -- no usable
#         /dev/udmabuf" and still count as passed), so a green nextest
#         summary here is not evidence those paths ran. See
#         `crates/scoot/src/compositor/dmabuf/tests.rs`'s module doc.
#   * `--nested` -- needs a host compositor (cage/sway) around the run. Only
#     `--headless` is exercised here.
#   * Performance. A shared runner's timings are noise; the before/after
#     benchmarks `CLAUDE.md` asks for stay on the dev VM.
#
# --------------------------------------------------------------------------
# WHY EVERY STEP RUNS THROUGH THE FLAKE
# --------------------------------------------------------------------------
# `nix develop` is the only dependency set this repo maintains: `flake.nix`
# pulls the compositor's C libraries from `vm/compositor-deps.nix`, the same
# list the dev VM's system profile uses. A hand-listed apt install of
# libseat/libinput/libxkbcommon/pixman/udev here would be a second list, and
# it would drift from the first with nothing to catch it.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Docs-only pushes (a merged docs PR, a backlog claim commit under
    # docs/backlog/claims/) start nothing. The workflow is skipped only when
    # EVERY changed path matches, so a commit that also touches code runs in
    # full. This is a workflow-level filter, which pull_request must not use
    # (a workflow that never starts leaves a required check waiting forever;
    # see the `changes` job) but which is safe here: nothing requires a check
    # on a push to main. It replaces asking every commit message to say
    # `[skip ci]`, a token GitHub honors anywhere in the message, including
    # in a body that merely mentions it. Keep it in step with the classify
    # job's `*.md | docs/*` case.
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

# Superseded runs are cancelled: pushing twice to a branch in a minute
# should not leave two full Smithay builds competing for a runner. Keyed by
# workflow as well as ref, so a second workflow added later cannot cancel
# this one's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repository a pull request changes, so a PR that
  # touches only one side does not rebuild and test the other: a docs-only
  # PR (every changed path a `*.md` file or under `docs/`) runs nothing,
  # since nothing in the build or the tests reads those files (if a crate
  # ever does, say an `include_str!` of a README, narrow the pattern
  # below). The split, from docs/scootbg/backlog/resolved/crate-and-daemon-done.md:
  #
  #   crates/scoot/, crates/scoot-core/, crates/scoot-ipc/,
  #   crates/scootctl/, scripts/smoke-test.sh, vm/compositor-deps.nix
  #                        -> scoot=true  (Linux, Linux-features) and
  #                           macos=true  (macOS)
  #   crates/scootbg/, crates/scootbg-mem/ -> scootbg=true (scootbg job)
  #     except crates/scootbg/Cargo.toml    -> scoot too: flake.nix reads
  #     its description, which the Linux job's `nix flake check` evaluates
  #
  # scootbg, scootbg-mem and scootbar never run on a Mac: the macOS job
  # leaves them out of its `cargo check`, and the Darwin outputs of the
  # flake have none of them, so no change to them alone sets `macos`.
  #   anything else that is not docs (Cargo.toml, Cargo.lock, flake.*,
  #   nix/, .github/, .config/, resources/ outside the session paths
  #   above, devenv.*, other scripts/ and
  #   vm/ files, LICENSE)                  -> all
  #   either side                          -> the scootbg-on-scoot
  #                                           integration job
  #
  # scripts/smoke-test.sh runs scootbg too (its [wallpaper] section, with
  # SMOKE_REQUIRE_SCOOTBG=1 in the Linux job), but a scootbg-only change
  # does not run that job. The pair is still checked on such a change:
  # the integration job's tests/scoot_config.rs has scoot itself spawn
  # `apply-config` from a [wallpaper] section, as the smoke test does.
  #
  #   crates/scootbar/, scripts/scootbar-bench/, scripts/scootbar-appearance-hw-test.sh
  #                                        -> scootbar=true (scootbar job, which
  #                                           also builds the Nix module check)
  #   resources/scoot-session, resources/systemd/*,
  #   scripts/scoot-session-test.sh        -> session=true (session-harness
  #                                           job: the launcher harness, no
  #                                           nix needed). nix/tests.nix stays
  #                                           on the catch-all (it tests far
  #                                           more than the session), which
  #                                           runs this job too.
  #   site/*, EXCEPT site content that is also matched above (nothing is:
  #   `*.md | docs/*` does not match `site/`, whose pages live in the tree
  #   since the move)                         -> docs-site=true (docs-site job:
  #                                           `nix build .#docs-site`, which
  #                                           also runs the llms and snippet
  #                                           gates). `nix/docs-site.nix` and
  #                                           `flake.nix`/`flake.lock` fall to
  #                                           the catch-all below and run
  #                                           everything, site included.
  #                                           `docs/**` does NOT set it: since
  #                                           the move the site builds only
  #                                           from `site/` (user pages were
  #                                           carried into the tree, not
  #                                           symlinked), so a docs-only change
  #                                           cannot alter the built site; the
  #                                           Pages deploy workflow tracks
  #                                           `docs/**` separately.
  #     except its Cargo.toml               -> scoot too, for the flake's
  #     read of its description, as scootbg's
  #   crates/scootbg-mem/                  -> scootbar too: its shm buffer
  #                                           is scootbar's
  #   crates/scoot-ipc/                    -> scootbar and scootbg too: the
  #                                           shared help pieces (plus the
  #                                           `quit` request scootbar's
  #                                           tests pin)
  #   either scoot or scootbar             -> the scootbar-on-scoot
  #                                           integration job
  #
  # Directory prefixes carry their trailing slash: `crates/scoot*` would
  # also match `crates/scootbg`, and `crates/scootbg/` does not match
  # `crates/scootbg-mem/`, which is why both are listed.
  #
  # `--no-renames` so a code file moved into docs/ or renamed to .md still
  # counts as a code change: rename detection would list only its new path.
  # Job-level `if`s rather than a workflow-level `paths:` filter, because a
  # skipped job reports success to a required status check, while a
  # workflow that never starts leaves the check waiting forever. Every
  # output starts `true` and is only lowered by a successful diff, and the
  # jobs skip only on an explicit `false`, so a failed classification runs
  # everything. Pushes to main always run everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scoot: ${{ steps.classify.outputs.scoot }}
      macos: ${{ steps.classify.outputs.macos }}
      scootbg: ${{ steps.classify.outputs.scootbg }}
      scootbar: ${{ steps.classify.outputs.scootbar }}
      backlog: ${{ steps.classify.outputs.backlog }}
      docs-site: ${{ steps.classify.outputs.docs-site }}
      session: ${{ steps.classify.outputs.session }}
    steps:
      # Depth 2: a pull_request run checks out the merge commit, whose first
      # parent is the base branch tip, so `HEAD^1..HEAD` is exactly the PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          scoot=true
          macos=true
          scootbg=true
          scootbar=true
          backlog=true
          docs_site=true
          session=true
          if [ "$EVENT" = pull_request ] && changed=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$changed" ]; then
            printf 'Changed:\n%s\n' "$changed"
            scoot=false
            macos=false
            scootbg=false
            scootbar=false
            backlog=false
            docs_site=false
            session=false
            while IFS= read -r path; do
              case "$path" in
                # Before `*.md`: the site's own pages are Markdown, and a
                # content-only site change must still build the site.
                site/*)
                  docs_site=true ;;
                *.md | docs/*) ;;
                # Needs a real `systemd --user`, which CI has none of: run by hand
                # (docs/scootbar/testing.md), so a change to it alone runs nothing.
                # The same for the Stylix run (fetches two flakes and builds
                # Stylix's palette generator; docs/scootbar/testing.md).
                scripts/scootbar-unit-test.sh | scripts/scootbar-stylix-test.sh) ;;
                # The backlog tool and its tests: only their own job.
                scripts/backlog | scripts/test_backlog.py)
                  backlog=true ;;
                # The session launcher and its harness: only their own job.
                # The harness fakes `systemctl`/`busctl`, so it needs just
                # sh and python3 -- no seat, no user manager, no nix.
                resources/scoot-session | resources/systemd/* | scripts/scoot-session-test.sh)
                  session=true ;;
                crates/scoot/* | crates/scoot-core/* | crates/scootctl/* | scripts/smoke-test.sh | vm/compositor-deps.nix)
                  scoot=true
                  macos=true ;;
                # The typo guesser and docs URL behind every binary's
                # `--help` live here: scoot and scootctl use them directly,
                # and since help-followups so do scootbar and scootbg.
                crates/scoot-ipc/*)
                  scoot=true
                  macos=true
                  scootbg=true
                  scootbar=true ;;
                # flake.nix takes the package description from this
                # manifest, which the Linux job's `nix flake check` reads.
                crates/scootbg/Cargo.toml)
                  scoot=true
                  scootbg=true ;;
                crates/scootbg/*)
                  scootbg=true ;;
                crates/scootbg-mem/*)
                  scootbg=true
                  scootbar=true ;;
                # Its manifest is read at eval time by flake.nix (the
                # package description), as scootbg's.
                crates/scootbar/Cargo.toml)
                  scoot=true
                  scootbar=true ;;
                crates/scootbar/*)
                  scootbar=true ;;
                # scootbar's benchmark harness; its unit tests run in the
                # scootbar job. It imports scootbg's runner, whose own
                # changes fall to the catch-all below and run everything.
                scripts/scootbar-bench/*)
                  scootbar=true ;;
                # The appearance hardware test: not run in CI (it needs a
                # real display), but its refusals are pinned by
                # crates/scootbar/tests/hw_script.rs in the scootbar job.
                scripts/scootbar-appearance-hw-test.sh)
                  scootbar=true ;;
                *)
                  scoot=true
                  macos=true
                  scootbg=true
                  scootbar=true
                  backlog=true
                  docs_site=true
                  session=true ;;
              esac
            done <<<"$changed"
          fi
          echo "scoot=$scoot macos=$macos scootbg=$scootbg scootbar=$scootbar backlog=$backlog docs_site=$docs_site session=$session"
          {
            echo "scoot=$scoot"
            echo "macos=$macos"
            echo "scootbg=$scootbg"
            echo "scootbar=$scootbar"
            echo "backlog=$backlog"
            echo "docs_site=$docs_site"
            echo "session=$session"
          } >>"$GITHUB_OUTPUT"

  # scripts/backlog is the swarm's claim tool and pushes to main, so its tests
  # (a throwaway bare origin and clones in a temp dir; nothing touches this repo)
  # run whenever it or they change, and on everything else too, as the other
  # jobs do. Fail open like them: only an explicit `false` skips.
  backlog-tools:
    name: Backlog tool tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backlog != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: scripts/backlog tests
        run: python3 scripts/test_backlog.py

  # The session launcher harness (scripts/scoot-session-test.sh): the proof
  # that the greeter-started session orders the display import before
  # `scoot-session.target`, heals stale sessions, refuses live ones, blocks
  # in `busctl wait` instead of polling, and survives a manager re-exec.
  # Its `systemctl`/`busctl` are faked, so it needs just sh and python3 --
  # no seat, no user manager, no nix -- and runs on ubuntu-latest as well
  # as macOS. Runs when the launcher, its units or the harness change, on
  # the catch-all, and on every push to main; fail open like the other
  # jobs (only an explicit `false` skips). What it cannot see stays a
  # manual run: a real `systemd --user` (activation edge cases the fake
  # may not match) and the Asahi idle-CPU measurement.
  session-harness:
    name: Session launcher harness
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.session != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: scripts/scoot-session-test.sh
        run: sh scripts/scoot-session-test.sh

  # The docs site (site/, nix/docs-site.nix): its own build, without any
  # Rust job gaining Node in its inputs (and without this job gaining
  # Rust). `nix build .#docs-site` renders the static site and runs the
  # gates inside the sandbox — `check-llms` (llms.txt covers every page,
  # every `.md` twin exists), `check-md-links` (no built HTML page links a
  # raw `.md` twin, every rewritten link resolves), `test-snippets` (fenced
  # toml/sh blocks are sound) and `test-nix` (fenced nix blocks parse) — so
  # a red gate fails this job, not the deploy. Runs when `site/**` changes
  # (checked before `*.md`, since the site's own pages are Markdown), on the
  # catch-all, and on every push to main; fail open like the other jobs
  # (only an explicit `false` skips). No store cache: the pnpm dependencies
  # arrive through the derivation's own hash.
  docs-site:
    name: Docs site (Starlight + llms.txt)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_site != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # The flake's own formatter over every tracked .nix file: a site-only
      # change skips the Linux job, which is the only other place this runs.
      - name: nix fmt --check (all tracked .nix)
        run: |
          git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      - name: nix build .#docs-site (builds the site, runs the llms and snippet gates)
        run: nix build -L --no-link .#docs-site

  linux:
    name: Linux (compositor)
    needs: changes
    # Fail open: only an explicit `false` skips, so a failed `changes` job
    # (empty output) still runs this one instead of skipping it green.
    if: ${{ !cancelled() && needs.changes.outputs.scoot != 'false' }}
    runs-on: ubuntu-latest
    # 60: this job builds Smithay once (the default features) and runs the
    # default suites and smoke. The gpu-scanout and xwayland rebuilds -- the
    # reason this used to be 90 -- now run in parallel in `linux-features`.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # No Nix *store* cache here, measured rather than assumed:
      # `magic-nix-cache-action@v15` was tried first and now requires a
      # FlakeHub account -- it failed to authenticate on every run
      # (35453015885, 35453689394), cached nothing, and still cost 11s up
      # front plus up to 1m51s in its own post step on macOS. Realising the
      # dev shell from cache.nixos.org instead costs ~35s of the first
      # `nix develop` below. The cargo cache is where the real time is: a
      # cold `target/` is ~2m of Smithay in each of clippy, build and test.
      # The compositor -- and every test that starts one -- binds a real
      # Wayland socket, and the IPC socket lives here too
      # (`crates/scoot-ipc/src/socket.rs` resolves `$SCOOT_SOCKET`, else
      # `$XDG_RUNTIME_DIR`). A GitHub runner has no `/run/user/<uid>`, so
      # without this the suites fail at startup rather than on anything they
      # mean to test. Exported for every later step, not just this one.
      - name: Create XDG_RUNTIME_DIR
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >>"$GITHUB_ENV"

      # Split restore/save rather than `actions/cache`: the combined action
      # saves only when the job succeeds, so a red run on main would rebuild
      # Smithay from scratch -- exactly when a fast turnaround matters most.
      # The save step below therefore runs on failure too, but only on main
      # and never on cancellation; see its own comment for why.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # `flake.lock` is in the key because it pins the toolchain: a
          # nixpkgs bump changes rustc, which invalidates every artifact in
          # `target/`. `run_id`/`run_attempt` make each run's key unique so
          # every run saves a fresh entry; `restore-keys` falls back to the
          # most recent entry sharing the prefix.
          key: linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            linux-cargo-

      # `CLAUDE.md`'s documented step is `cargo fmt --check -p scoot`; this is
      # a superset. `scoot-core` and `scoot-ipc` cost nothing extra to check
      # and nothing else checks them.
      - name: cargo fmt
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo fmt --all --check

      # The flake's own outputs -- `packages`, the `homeModules`/`nixosModules`
      # wrappers, `checks.*.scoot-modules` -- are what a Nix consumer installs,
      # and nothing else in this job evaluates them: `nix develop` reads only
      # `devShells`. `nix flake check` evals every output for this system and
      # builds and runs the module suite, so a change that breaks the packaging
      # while `cargo build` stays green fails here (gh #173 -- proven by
      # breaking a module option and watching this step go red while cargo
      # stayed green; see the resolved ticket). Plain `run`, not `nix develop`:
      # these are nix commands, not shell commands. Directly after `cargo fmt`
      # -- the first step that realises the dev shell, so the store is warm --
      # and before the Smithay builds below, so a broken package fails fast.
      # `-L` is log detail, per the issue.
      - name: nix fmt --check (all tracked .nix)
        # `git ls-files` rather than a hand-listed set, so a new `.nix` file is
        # covered without anyone remembering to list it; explicit paths rather
        # than `nix fmt -- --check .` (deprecated directory form) or bare
        # `nix fmt` (reads empty stdin and errors -- a pre-existing nixfmt
        # quirk). Resolves to the flake's own `formatter` (pkgs.nixfmt).
        run: |
          git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      - name: nix flake check
        run: nix flake check -L

      # FlakeHub publishes the flake by evaluating every system, and
      # `nix flake check` above is not that: it only evals this
      # runner's system. An eval-time read of a platform-specific
      # derivation (gh #486: `builtins.readFile` of the generated
      # displays.json) passes check here and still breaks the publish
      # on a host that cannot build that platform. This step is that
      # publish-time eval, JSON form, nothing built: it fails before
      # merge exactly where FlakeHub failed after it.
      - name: nix flake show --all-systems (FlakeHub eval gate)
        run: nix flake show --all-systems --json --no-write-lock-file > /dev/null

      # Also a superset of the documented `-p scoot --all-targets`, for the
      # same reason: their dependencies are built here anyway.
      - name: cargo clippy
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # ------------------------------------------------------------------
      # The GPU-free build is a HARD REQUIREMENT, not a preference: scoot has
      # to run in a GPU-less container (webtop) and on boxes with no GL stack
      # installed at all, which is why pixman is the default renderer and why
      # Smithay's `backend_gbm` is deliberately not in the default feature set
      # (see `crates/scoot/Cargo.toml`). Nothing but a human remembering to
      # look has enforced that so far. `ldd` reports the whole DT_NEEDED
      # closure, so this also catches a GPU library arriving *transitively*
      # through something else.
      # ------------------------------------------------------------------
      - name: Build the default compositor, and assert it links no GPU stack
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          cargo build -p scoot -p scootbg
          # Kept aside: the smoke test below must run this default build, and
          # `linux-features` builds its own feature binaries from the same
          # restored cache rather than overwriting these. scootbg too: the
          # smoke test's [wallpaper] section runs it (it links no GPU stack
          # either way; its own job checks that).
          cp target/debug/scoot "$RUNNER_TEMP/scoot-default"
          cp target/debug/scootbg "$RUNNER_TEMP/scootbg-default"

          echo "--- ldd target/debug/scoot ---"
          ldd target/debug/scoot

          # Matches the soname field, not the whole line, so an unrelated
          # store path that happens to contain the string cannot trip it.
          leaked=$(ldd target/debug/scoot | awk '{ print $1 }' | grep -Ei '^lib(gbm|drm|EGL|GLESv2)' || true)
          if [ -n "$leaked" ]; then
            echo "::error title=The default build links a GPU library::$(echo "$leaked" | tr '\n' ' ')-- the default build must run on a box with no GPU stack installed (see CLAUDE.md's fixed decisions). A GPU dependency belongs behind the gpu-scanout feature."
            echo "the default build links these, and must not:"
            ldd target/debug/scoot | grep -Ei 'libgbm|libEGL'
            exit 1
          fi
          echo "ok: the default build links no libgbm and no libEGL"

      # `render/tests.rs` states, as a deliberate decision, that its GLES
      # tests fail rather than skip where EGL is missing, on the reasoning
      # that "any machine [able to run this suite] has Mesa's software EGL
      # device even with no GPU at all -- that is exactly what this
      # project's dev VM is". A GitHub runner is the first machine that
      # runs the suite and is *not* that: the first CI run on this branch
      # died at `a_capture_covers_the_whole_target_at_the_backends_own_size`
      # with `Failed to load LibEGL: libEGL.so.1: cannot open shared object
      # file` (run 35453015885), taking 333 unrun tests with it.
      #
      # The dev VM resolves that dlopen through `/run/current-system/sw/lib`
      # in the binary's RUNPATH -- a NixOS path a runner does not have. So
      # CI is given the software EGL the suite documents needing, rather
      # than any test being changed: libglvnd is already in the dev shell's
      # `$LIBRARY_PATH` (`vm/compositor-deps.nix`), and Mesa supplies the
      # vendor driver libglvnd dispatches to. `--inputs-from .` pins Mesa to
      # this repo's own `flake.lock`, like every other dependency here.
      #
      # Exported under CI-only names, then mapped onto the real variables by
      # the two test steps alone: the smoke test below deliberately keeps
      # running in an environment with *no* loadable EGL, which is the
      # GPU-less box scoot has to work on.
      - name: Resolve a software EGL for the GLES tests
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          mesa=$(nix build --inputs-from . nixpkgs#mesa --no-link --print-out-paths | head -1)
          test -e "$mesa/share/glvnd/egl_vendor.d/50_mesa.json"
          {
            echo "CI_EGL_LIBRARY_PATH=$LIBRARY_PATH:$mesa/lib"
            echo "CI_EGL_VENDOR_DIRS=$mesa/share/glvnd/egl_vendor.d"
          } >>"$GITHUB_ENV"

      - name: cargo nextest
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          export LD_LIBRARY_PATH="$CI_EGL_LIBRARY_PATH"
          export __EGL_VENDOR_LIBRARY_DIRS="$CI_EGL_VENDOR_DIRS"
          # --no-fail-fast, unlike the local loop: CI's job is to report every
          # failure in one run. Without it a single early failure hides the
          # rest -- run 35453015885 stopped with 333 tests unrun.
          # Scoped to the compositor side: scootbg's own suites live in the
          # `scootbg` job and its live-compositor runs in
          # `scootbg-integration`, so running them here too only repeats that
          # work (this job still builds scootbg for the smoke test's
          # [wallpaper] section below).
          cargo nextest run -p scoot -p scoot-core -p scoot-ipc -p scootctl --no-fail-fast

      # NOT a duplicate of the nextest run above -- do not delete it as one.
      # nextest runs every test in its own process, so it structurally cannot
      # see a test that breaks when it *shares* a process with its neighbours
      # (this workspace has suites that share `smithay::utils::SERIAL_COUNTER`
      # and say so in as many words). `cargo test` runs them concurrently in
      # one process, so it catches exactly that, and cannot catch what nextest
      # catches. Since 2026-09-19 `cargo test` is no longer a required local
      # step (`CLAUDE.md`, "Verification and evidence"), which makes this the
      # only place that coverage is still taken.
      - name: cargo test (one process -- the coverage nextest cannot give)
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          export LD_LIBRARY_PATH="$CI_EGL_LIBRARY_PATH"
          export __EGL_VENDOR_LIBRARY_DIRS="$CI_EGL_VENDOR_DIRS"
          # Same scope as the nextest step above, for the same reason.
          cargo test -p scoot -p scoot-core -p scoot-ipc -p scootctl

      # End to end over IPC: starts the compositor, spawns a terminal in it,
      # types into that terminal, reads the characters back out of the shell,
      # drives keybindings, and samples real pixels out of a screenshot.
      # `--headless` is the one backend a runner can host (the script is
      # otherwise backend-agnostic -- see its header).
      #
      # The tools here are the smoke test's own harness (`foot` to be the
      # client, `jq` to read IPC replies, ImageMagick to sample pixels,
      # `wayland-info` for the dmabuf-advertisement check) -- not compositor
      # dependencies, which come from the dev shell as everywhere else.
      # `--inputs-from .` resolves `nixpkgs` through this repo's own
      # `flake.lock`, so they are pinned to the same revision as the dev
      # shell rather than to a second, floating one.
      - name: scripts/smoke-test.sh (--headless)
        timeout-minutes: 15
        env:
          SCOOT: ${{ runner.temp }}/scoot-default
          # The [wallpaper] section's end-to-end check runs this scootbg, and
          # REQUIRE turns "no scootbg, skipped" into a failure, so this step
          # cannot go green by skipping it.
          SCOOTBG: ${{ runner.temp }}/scootbg-default
          SMOKE_REQUIRE_SCOOTBG: "1"
          # Keeps every socket, log and screenshot under RUNNER_TEMP: the
          # script's unprefixed defaults live in `/run/user/<uid>`, which a
          # runner does not have.
          SMOKE_PREFIX: ${{ runner.temp }}/smoke
        shell: nix shell --inputs-from . nixpkgs#foot nixpkgs#jq nixpkgs#imagemagick nixpkgs#wayland-utils --command bash -euo pipefail {0}
        run: |
          # Negative control for the GPU-free requirement, and the reason it
          # is here rather than in the test steps: those are deliberately
          # given a software EGL (see "Resolve a software EGL"), so they
          # cannot prove anything about a box without one. This step is the
          # only place scoot runs the way a webtop/no-GPU box runs it, which
          # makes it the real guard -- so assert the premise rather than
          # assuming it. A job-level LD_LIBRARY_PATH or a dev-shell change
          # could otherwise hand this step an EGL and silently erase the
          # guarantee with nothing failing.
          if ldconfig -p 2>/dev/null | grep -qi 'libEGL\.so'; then
            echo "::error title=The smoke step can load libEGL::this step is the only GPU-free run in CI, and something has put an EGL on its library path. Either scope that change to the test steps, or this workflow no longer proves scoot runs without a GPU stack."
            exit 1
          fi
          echo "ok: no loadable libEGL here -- this run is the GPU-free path"
          scripts/smoke-test.sh

      # Measure, then prune, before the save below. `gh cache list` put the
      # `linux-cargo-` entries at 7.15 GiB each (2026-09-28): a debug `target/`
      # holding one Smithay build per feature set -- the default one here,
      # plus gpu-scanout and xwayland when they still ran in this same job --
      # on top of incremental artifacts no future run reuses (every run builds
      # different code, so incremental output costs restore/save bytes without
      # ever saving build time). The feature rebuilds now run in
      # `linux-features`, which restores this same cache and never saves, so
      # they no longer inflate what is stored; what is left to trim here is
      # `target/debug/incremental`. The `du` lines keep the next measurement
      # in the log. Same run condition as the save: this must also run when
      # the tests fail, or a red main would save unpruned.
      - name: Measure and prune the cargo cache before saving
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          du -sh target ~/.cargo/registry ~/.cargo/git 2>/dev/null || true
          rm -rf target/debug/incremental target/release/incremental
          du -sh target 2>/dev/null || true

      - name: Save the cargo cache
        # Not `always()`, which also fires on cancellation -- and
        # cancel-in-progress makes that routine, risking a partially written
        # target/ saved under the primary key. And not on every PR run: six
        # runs of one PR already put this repo at 10.07 GB against GitHub's
        # 10 GB LRU budget, all of it scoped to refs/pull/N/merge where no
        # other branch can read it. Saving only on main keeps one shared,
        # restorable entry; PR runs restore from it and save nothing.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # The restore step's own key, not a second copy of the expression:
          # `hashFiles` re-evaluated here would hash the tree as the build
          # left it, so any file the build touched would save under a key
          # the next run's restore cannot predict.
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The opt-in feature tiers, split out of `linux` so the two jobs run in
  # parallel: the gpu-scanout positive-control build, and the xwayland tier
  # (clippy, both test runners with the live suites required, and the
  # xwayland smoke run). Same `needs: changes` + scoot gate as `linux`, and
  # the same `linux-cargo-` key prefix -- these *are* the `linux` job's
  # entries, restored read-only. This job saves nothing, so the repo keeps a
  # single `linux-cargo-` cache line (see the `linux` job's save step for why
  # only one line can exist under the 10 GB budget).
  linux-features:
    name: "Linux (features: gpu-scanout, xwayland)"
    needs: changes
    # Fail open: only an explicit `false` skips, so a failed `changes` job
    # (empty output) still runs this one instead of skipping it green.
    if: ${{ !cancelled() && needs.changes.outputs.scoot != 'false' }}
    runs-on: ubuntu-latest
    # Two Smithay rebuilds (one per feature set) plus both suites under
    # xwayland and a smoke run -- less than the 90 this cost inside `linux`
    # with three rebuilds, more than the default-only half left there.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # As in `linux`: the suites bind real sockets, and a runner has no
      # `/run/user/<uid>`.
      - name: Create XDG_RUNTIME_DIR
        run: |
          mkdir -p -m 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >>"$GITHUB_ENV"

      # Restore-only, from the `linux` job's entries: every dependency but
      # Smithay and scoot (which each feature set rebuilds anyway) comes
      # from there. Never saved -- a second cache line would push the repo
      # past GitHub's 10 GB budget (see the `linux` job's save step).
      - name: Restore the cargo cache (the linux job's, read-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
          restore-keys: |
            linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            linux-cargo-

      # Same software EGL as the `linux` test steps: the xwayland suite run
      # below includes the GLES tests, which fail rather than skip where EGL
      # is missing (see the `linux` job's note). The smoke step at the end
      # deliberately keeps running with no loadable EGL, as there.
      - name: Resolve a software EGL for the GLES tests
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          mesa=$(nix build --inputs-from . nixpkgs#mesa --no-link --print-out-paths | head -1)
          test -e "$mesa/share/glvnd/egl_vendor.d/50_mesa.json"
          {
            echo "CI_EGL_LIBRARY_PATH=$LIBRARY_PATH:$mesa/lib"
            echo "CI_EGL_VENDOR_DIRS=$mesa/share/glvnd/egl_vendor.d"
          } >>"$GITHUB_ENV"

      # The other half of the GPU-free requirement: the opt-in tier still has
      # to build (nothing else builds it, so it can rot silently), and the
      # default build's negative assertion in `linux` is only meaningful if a
      # build that *should* link libgbm actually does. Without this positive
      # control, an `ldd` aimed at the wrong binary, or a feature that quietly
      # stopped pulling `smithay/backend_gbm`, would leave the no-GPU check
      # passing while testing nothing.
      #
      # First of the two feature builds: `--features` changes the
      # unification, so this rebuilds Smithay and `scoot`. The xwayland build
      # below rebuilds them again, so `target/debug/scoot` ends as that one;
      # neither escapes except through the kept-aside copies (the default
      # build's smoke run lives in `linux` and uses that job's copies).
      - name: Build --features gpu-scanout, and assert that one does link libgbm
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          cargo build -p scoot --features gpu-scanout
          echo "--- ldd target/debug/scoot (--features gpu-scanout) ---"
          ldd target/debug/scoot
          if ! ldd target/debug/scoot | awk '{ print $1 }' | grep -qEi '^libgbm'; then
            echo "::error title=The gpu-scanout build does not link libgbm::either the feature no longer pulls smithay/backend_gbm, or this checked the wrong binary -- which would make the default build's no-GPU assertion vacuous."
            exit 1
          fi
          echo "ok: --features gpu-scanout links libgbm, so the libgbm half of the default build's assertion is a real one"
          echo "note: libEGL/libGLESv2 are dlopen'd by renderer_gl and never appear in ldd for either build, so"
          echo "      those clauses are belt-and-braces against a future static link, not live checks. What"
          echo "      actually guards the GPU-free path is the default build's smoke test in linux, which runs with no loadable EGL."

      # The opt-in XWayland tier (`--features xwayland`): nothing else here
      # builds it, and its live suites -- window mapping, the focus gate
      # (focus-steal refusals, token spending), the lock's blanking and input
      # refusal -- are security regression tests that must run somewhere
      # automated. They drive a real `Xwayland` server, so one is put on
      # PATH (plus xclock/xeyes, which two suites use for a second X client
      # process, and procps for `pkill`), pinned like the smoke tools through this repo's
      # `flake.lock`. `SCOOT_REQUIRE_XWAYLAND` turns every live test's quiet
      # "skipped -- no Xwayland (or xclock/xeyes/pkill) on PATH" into a failure, so a PATH
      # regression here cannot leave the security suites green by skipping
      # (see `compositor/xwayland/tests/mod.rs`'s `xwayland_on_path`).
      #
      # Second of the two feature builds, after gpu-scanout above and for the
      # same reason: the feature changes Smithay's unification and rebuilds
      # it. The GLES tests in the suite need the same software EGL as the
      # default test steps in `linux`.
      - name: --features xwayland -- clippy, nextest and cargo test, live suites required
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          # procps too: the dead-server test kills the server with `pkill`,
          # and the host's pkill loads the host glibc against the Nix
          # libraries `LD_LIBRARY_PATH` names below (run 36144028882 died on
          # `GLIBC_ABI_GNU2_TLS not found`). A Nix pkill agrees with them.
          x=$(nix build --inputs-from . nixpkgs#xwayland nixpkgs#xclock nixpkgs#xeyes nixpkgs#procps --no-link --print-out-paths)
          for path in $x; do export PATH="$path/bin:$PATH"; done
          command -v Xwayland pkill
          pkill --version
          export SCOOT_REQUIRE_XWAYLAND=1
          export LD_LIBRARY_PATH="$CI_EGL_LIBRARY_PATH"
          export __EGL_VENDOR_LIBRARY_DIRS="$CI_EGL_VENDOR_DIRS"
          cargo clippy -p scoot --all-targets --features xwayland -- -D warnings
          cargo nextest run -p scoot --features xwayland --no-fail-fast
          cargo test -p scoot --features xwayland
          # The binary for the smoke run below. Only the `scoot` crate itself
          # compiles here: the tests above built every dependency with the
          # same features and profile.
          cargo build -p scoot --features scoot/xwayland
          cp target/debug/scoot "$RUNNER_TEMP/scoot-xwayland"
          # scootbg separately, without features: the daemon has no xwayland
          # feature and talks to scoot only over Wayland, so the smoke run's
          # [wallpaper] section uses this rather than skipping. Built here --
          # not copied from `linux` -- because jobs share nothing but the
          # cargo cache.
          cargo build -p scootbg
          cp target/debug/scootbg "$RUNNER_TEMP/scootbg-features"

      # The default build's smoke run lives in `linux`, where both xwayland
      # sections can only report "this build has no xwayland feature". This
      # runs the whole script against the xwayland build with `Xwayland` and
      # `xeyes` on PATH, so the real binary's `--xwayland` path is exercised
      # end to end: the server reaching READY from `compositor::run`,
      # `DISPLAY` reaching a spawned child, an X window listed and closed over
      # IPC -- and, with the binary hidden from PATH, the loud Wayland-only
      # fallback a `--tty` login without Xwayland gets. The ~10 s the script
      # takes, plus the `scoot` crate's rebuild above (the dependencies are
      # already built), is the whole cost. No GPU-free assertion here: that is
      # the default build's run in `linux`, and `Xwayland` itself links Mesa.
      - name: scripts/smoke-test.sh (--headless, --features xwayland, Xwayland on PATH)
        timeout-minutes: 15
        env:
          SCOOT: ${{ runner.temp }}/scoot-xwayland
          # The scootbg built above, without features: the daemon has no
          # xwayland feature and talks to scoot only over Wayland, so the
          # [wallpaper] section runs here too rather than skipping.
          SCOOTBG: ${{ runner.temp }}/scootbg-features
          SMOKE_REQUIRE_SCOOTBG: "1"
          SMOKE_PREFIX: ${{ runner.temp }}/smoke-xwayland
        shell: nix shell --inputs-from . nixpkgs#foot nixpkgs#jq nixpkgs#imagemagick nixpkgs#wayland-utils nixpkgs#xwayland nixpkgs#xeyes --command bash -euo pipefail {0}
        run: |
          command -v Xwayland xeyes
          scripts/smoke-test.sh
          # Both xwayland sections must have run their real branches, not
          # skipped: a green run that only said "no xwayland feature" here
          # would prove nothing about this build.
          log="$RUNNER_TEMP/smoke-xwayland-xwayland.log"
          grep -q "XWayland is ready" "$log"
          grep -q "Xwayland. must be on PATH" "$RUNNER_TEMP/smoke-xwayland-nox.log"

      # No save step, deliberately: see the job header. This job's `target/`
      # holds feature-rebuilt Smithay that the default build cannot reuse, so
      # saving it would only buy a second multi-gigabyte cache line.

  # The GPU tier and XWayland together (`packages.scoot-gpu-xwayland`,
  # `--features gpu-scanout,xwayland`): the Linux jobs build each feature on
  # its own (`linux` the default, `linux-features` each opt-in tier), never
  # both, so a break that only the pair shows -- Smithay's
  # feature unification, a `cfg` that assumes one feature means the other is
  # off -- would reach users of that package unseen. A separate job so it runs
  # in parallel with `linux` and adds no wall-clock time (it is a fraction of
  # that job's length), and only when the compositor could have changed.
  # A compile-and-lint of every target, tests included, not a release build:
  # the risk is the pair failing to compile, and `nix build` of the package
  # is a full release build this does not repeat -- `nix eval` below checks
  # the package still resolves with both features.
  gpu-xwayland:
    name: Linux (gpu-scanout + xwayland)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scoot != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # Restore only, from the `linux` job's entries: every dependency but
      # Smithay and scoot (which this feature pair rebuilds anyway) comes
      # from there. Never saved -- a second cache line would push the repo
      # past GitHub's 10 GB budget (see the `linux` job's save step).
      - name: Restore the cargo cache (the linux job's, read-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
          restore-keys: |
            linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            linux-cargo-

      - name: nix eval .#scoot-gpu-xwayland builds with both features
        run: |
          features=$(nix eval --raw .#packages.x86_64-linux.scoot-gpu-xwayland.cargoBuildFeatures --apply 'f: builtins.concatStringsSep " " f')
          echo "cargoBuildFeatures: $features"
          case " $features " in
            *" gpu-scanout "*) ;;
            *) echo "::error title=scoot-gpu-xwayland lost gpu-scanout::features: $features"; exit 1 ;;
          esac
          case " $features " in
            *" xwayland "*) ;;
            *) echo "::error title=scoot-gpu-xwayland lost xwayland::features: $features"; exit 1 ;;
          esac

      - name: cargo clippy -p scoot --all-targets --features gpu-scanout,xwayland
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo clippy -p scoot --all-targets --features gpu-scanout,xwayland -- -D warnings

  macos:
    # The compositor is Linux-only; on macOS the same `scoot` package is
    # client-only (`scoot msg` drives a compositor running elsewhere).
    # Nobody builds that half on a Mac between releases, and it has broken
    # before without anyone noticing -- this job is the cheap insurance
    # against that.
    # `macos-latest` is arm64, which is the only Darwin system `flake.nix`
    # provides (it drops x86_64-darwin; see the comment there).
    name: macOS (scoot client)
    needs: changes
    # Fail open: only an explicit `false` skips, so a failed `changes` job
    # (empty output) still runs this one instead of skipping it green.
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # No Nix store cache -- see the Linux job's note on why.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macos-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            macos-cargo-

      # `--all-targets` so the tests and the CLI's own test targets are
      # type-checked too, not just the library and binary. The wallpaper
      # daemon and the bar never run on a Mac, and do not build there
      # (scootbg-mem's `compile_error!` says so), so they are left out, with
      # scootbg-mem: this checks
      # scoot (its Linux halves cfg'd out: a Mac `scoot` is the `scoot msg`
      # client), the client library, scoot-ipc and scoot-core. The same
      # command on a Mac is in docs/development.md.
      - name: cargo check
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo check --workspace --exclude scootbar --exclude scootbg --exclude scootbg-mem --all-targets

      # The client half has to run, not just compile, on a Mac: `scoot msg
      # --help` needs no display and no compositor.
      - name: scoot msg --help runs on macOS
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo run -q -p scoot -- msg --help

      # The Darwin half of gh #173: `nix flake check` on Linux omits the
      # Darwin systems (and vice versa), so the Linux job above never
      # evaluates `packages.aarch64-darwin.*`, the Darwin `apps`, or the
      # Darwin module checks. Same command, seconds on a warm store; the
      # `.nix` format pin lives in the Linux job only (formatting is
      # system-independent -- running it twice would prove nothing twice).
      - name: nix flake check
        run: nix flake check -L

      - name: Save the cargo cache
        # Same condition as the Linux job's save -- see the comment there for
        # why it is not `always()` and not every PR run.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # The restore step's own key -- see the Linux job's note.
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # scootbg, the wallpaper daemon (crates/scootbg, crates/scootbg-mem): its
  # own checks, without building the compositor. Its compositor-backed
  # integration tests skip here (no `scoot` binary is built in this job);
  # they run for real in the next job.
  scootbg:
    name: scootbg (wallpaper daemon)
    needs: changes
    # Fail open, as above.
    if: ${{ !cancelled() && needs.changes.outputs.scootbg != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # Its own cache: this job never builds Smithay, so sharing the Linux
      # job's (gigabytes of it) would cost more to restore than it saves.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: scootbg-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scootbg-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            scootbg-cargo-

      - name: cargo fmt
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo fmt --check -p scootbg -p scootbg-mem

      # `-D warnings` also enforces scootbg-mem's own `[lints]`: every
      # `unsafe` block carries a `// SAFETY:` comment and holds one
      # operation (`undocumented_unsafe_blocks`, `multiple_unsafe_ops_per_block`).
      # scootbg itself is `#![forbid(unsafe_code)]`, which rustc enforces.
      - name: cargo clippy
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo clippy -p scootbg -p scootbg-mem --all-targets -- -D warnings

      # The fuzz crate (crates/scootbg/fuzz) is its own workspace, so no
      # other step compiles it, and it builds the image modules by
      # `#[path]`: a refactor there can break it silently. Compiled only,
      # not fuzzed (its README runs that, for minutes, by hand); its corpus
      # and past crashes are replayed on stable by `cargo test` above.
      - name: cargo check of the fuzz crate
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo check --manifest-path crates/scootbg/fuzz/Cargo.toml --target-dir target/scootbg-fuzz --locked

      # Both runners, for the reason the Linux job gives: nextest isolates
      # each test in its own process, `cargo test` shares one.
      - name: cargo nextest and cargo test
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          cargo nextest run -p scootbg -p scootbg-mem --no-fail-fast
          cargo test -p scootbg -p scootbg-mem

      # scootbg's rule is no C beyond what std links: no `libc` crate in its
      # normal dependency tree (rustix on its `linux_raw` backend), and no
      # shared library beyond glibc and libgcc_s. `cargo tree` resolves the
      # host target, the one this binary ships for.
      - name: No libc crate, and what the release binary links
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          if cargo tree -p scootbg -e normal --prefix none | grep -q '^libc '; then
            echo "::error title=scootbg depends on the libc crate::scootbg calls no C (docs/scootbg/README.md, Standards); find the path with: cargo tree -p scootbg -e normal -i libc"
            cargo tree -p scootbg -e normal -i libc
            exit 1
          fi
          echo "ok: no libc crate in scootbg's normal dependency tree"
          # Weighed alone, never in a --workspace build (feature unification).
          # Warnings are errors here: code reached only from debug builds
          # (`cfg(debug_assertions)`) warns only in a release build, which
          # no other step makes. `-D warnings` changes lint levels, not
          # codegen, and the size below is of this same build.
          RUSTFLAGS="-D warnings" cargo build --release -p scootbg
          echo "release binary: $(stat -c %s target/release/scootbg) bytes (stripped)"
          ldd target/release/scootbg
          extra=$(ldd target/release/scootbg | awk '{ print $1 }' | grep -vE '^(linux-vdso|libc\.so|libm\.so|libgcc_s\.so|/)' || true)
          if [ -n "$extra" ]; then
            echo "::error title=scootbg links a library beyond std's::$(echo "$extra" | tr '\n' ' ')"
            exit 1
          fi
          echo "ok: links only what std links"

      - name: Save the cargo cache
        # Same condition as the Linux job's save; see the comment there.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # scootbg against a live `scoot --headless`: the daemon's socket
  # lifecycle and its per-output surfaces end to end
  # (crates/scootbg/tests/{daemon,outputs}.rs), outputs coming and going
  # on a headless sway (tests/hotplug.rs), and colors and images checked
  # by real pixels on both (tests/color.rs, tests/image.rs,
  # tests/scale.rs at fractional scales, and tests/share.rs for outputs
  # of one size sharing an image's pixels: scoot's own screenshots, and
  # sway's through a wlr-screencopy client in the test), and the last
  # wallpaper restored across a daemon restart (tests/restore.rs), and
  # `apply-config`, scoot's one command, through the precedence table of
  # docs/scootbg/backlog/resolved/scoot-integration-done.md (tests/config.rs),
  # and scoot's own `[wallpaper]` section driving it (tests/scoot_config.rs:
  # scoot spawns `apply-config` at start-up and on each reload), and failed
  # draws explaining themselves in `query` (tests/draw_failed.rs).
  # Runs when either side changes, since each can break the other's
  # end-to-end run.
  # `SCOOTBG_REQUIRE_SCOOT` and `SCOOTBG_REQUIRE_SWAY` turn the tests'
  # "skipped -- no scoot binary" / "no sway" into failures, so this job
  # cannot go green by skipping.
  scootbg-integration:
    name: scootbg on headless scoot
    needs: changes
    # Fail open: skipped only when both sides are explicitly unchanged.
    if: ${{ !cancelled() && (needs.changes.outputs.scoot != 'false' || needs.changes.outputs.scootbg != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Create XDG_RUNTIME_DIR
        run: |
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >>"$GITHUB_ENV"

      # Restore-only, from the Linux job's entries: they hold the Smithay
      # build this job needs, and this job adds nothing worth saving twice.
      - name: Restore the cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            linux-cargo-

      - name: Build scoot and scootbg
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo build -p scoot -p scootbg

      # The hotplug tests' second compositor: only sway can add and remove
      # outputs at runtime (scoot's headless backend cannot yet). Headless,
      # pixman, no GPU; from the flake's own pinned nixpkgs, out of the
      # binary cache.
      - name: Fetch sway
        run: |
          sway=$(nix build --inputs-from . nixpkgs#sway --no-link --print-out-paths)
          echo "SCOOTBG_TEST_SWAY=$sway/bin/sway" >>"$GITHUB_ENV"

      # The tests find `scoot` beside `scootbg` in target/debug, built by the
      # step above from this same tree, and sway where the step above said.
      - name: Integration tests, compositors required
        shell: nix develop --command bash -euo pipefail {0}
        env:
          SCOOTBG_REQUIRE_SCOOT: "1"
          SCOOTBG_REQUIRE_SWAY: "1"
        run: |
          cargo nextest run -p scootbg --test daemon --test outputs --test hotplug --test color --test image --test scale --test share --test restore --test config --test scoot_config --test draw_failed --no-fail-fast
          cargo test -p scootbg --test daemon --test outputs --test hotplug --test color --test image --test scale --test share --test restore --test config --test scoot_config --test draw_failed

  # scootbar, the status bar (crates/scootbar): its own checks, without
  # building the compositor, as the scootbg job does. Its compositor-backed
  # integration tests skip here (no `scoot` binary is built in this job);
  # they run for real in the next job.
  scootbar:
    name: scootbar (status bar)
    needs: changes
    # Fail open, as above.
    if: ${{ !cancelled() && needs.changes.outputs.scootbar != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # Its own cache, for the reason the scootbg job gives.
      - name: Restore the cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: scootbar-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scootbar-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            scootbar-cargo-

      - name: cargo fmt
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo fmt --check -p scootbar

      # The Nix modules' check (nix/scootbar-tests.nix) runs this crate's own
      # `daemon --check` over every rendered bar.toml, so a change to the bar
      # alone must run it: `nix flake check` is in the Linux job, which a
      # bar-only change does not start. This is also the x86_64-linux build
      # of `packages.scootbar` and of that check (the runner is x86_64).
      - name: nix build the scootbar module check (x86_64-linux)
        run: nix build -L --no-link .#checks.x86_64-linux.scootbar-modules

      # The benchmark harness's own logic (configs, the gates, the
      # arithmetic): the standard library only, no compositor or bar.
      - name: Benchmark harness tests
        run: python3 -m unittest discover -s scripts/scootbar-bench -p 'test_*.py'

      # scootbar's features, read from its manifest (every feature but
      # `default`: one per module, and `icon-image`, the optional PNG
      # decoder; crates/scootbar/Cargo.toml says so), for the feature
      # matrix in the next two steps, so a new module joins the matrix
      # with no change here.
      - name: List scootbar's modules
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          modules=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "scootbar") | .features | keys[] | select(. != "default")] | join(" ")')
          [ -n "$modules" ] || { echo "::error title=no scootbar modules::cargo metadata listed no features"; exit 1; }
          echo "modules: $modules"
          echo "SCOOTBAR_MODULES=$modules" >>"$GITHUB_ENV"

      # scootbar is `#![forbid(unsafe_code)]`, which rustc enforces; its
      # two mappings (the shm buffer, a font on a read-only mount) are
      # scootbg-mem's, checked in the scootbg job. The Cargo-feature matrix:
      # the default build, the smallest (every module left out), which must
      # stay buildable, and each module alone, so no module leans on
      # another's code.
      - name: cargo clippy, every feature set
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          cargo clippy -p scootbar --all-targets -- -D warnings
          cargo clippy -p scootbar --no-default-features --all-targets -- -D warnings
          for module in $SCOOTBAR_MODULES; do
            echo "--- $module alone"
            cargo clippy -p scootbar --no-default-features --features "$module" --all-targets -- -D warnings
          done
          # `popup` is not a module but a bar facility a module's content
          # rides on, so it is also built with each module: with `clock`
          # (which has none) it had dead code that "each alone" never saw.
          for module in $SCOOTBAR_MODULES; do
            [ "$module" = popup ] && continue
            echo "--- popup and $module"
            cargo clippy -p scootbar --no-default-features --features "popup,$module" --all-targets -- -D warnings
          done

      # Both runners on the default build, for the reason the Linux job
      # gives. Then the unit tests of every other feature set: every module
      # at once, none, and each alone. The module contract
      # (`modules/tests.rs`) walks the registry of the build it is compiled
      # in, so a module left out of `default` reaches it only here. Unit
      # tests only (`--bin scootbar`): the integration tests need a
      # compositor, which this job does not build. `--all-features` is the
      # default build while every module is in `default`, and reuses it.
      - name: cargo nextest and cargo test
        shell: nix develop --command bash -euo pipefail {0}
        env:
          # The bus tests start a private `dbus-daemon`; without this a
          # missing one would skip them quietly.
          SCOOTBAR_REQUIRE_DBUS_DAEMON: "1"
        run: |
          # `dbus-daemon` from the pinned nixpkgs for this step only, as
          # cargo-fuzz is below: the dev shell is every job's, and a tool
          # one job's tests start does not belong in all of them. `^out`,
          # because the bare attribute prints two paths (the man output
          # too), and `$dbus/bin` would be neither.
          dbus=$(nix build --inputs-from . 'nixpkgs#dbus^out' --no-link --print-out-paths)
          test -x "$dbus/bin/dbus-daemon"
          export PATH="$dbus/bin:$PATH"
          cargo nextest run -p scootbar --no-fail-fast
          cargo test -p scootbar
          echo "--- every module"
          cargo nextest run -p scootbar --bin scootbar --all-features --no-fail-fast
          echo "--- no module"
          cargo nextest run -p scootbar --bin scootbar --no-default-features --no-fail-fast
          for module in $SCOOTBAR_MODULES; do
            echo "--- $module alone"
            cargo nextest run -p scootbar --bin scootbar --no-default-features --features "$module" --no-fail-fast
          done

      # No C beyond what std links, as for scootbg: no `libc` crate in the
      # normal dependency tree, and no shared library beyond glibc and
      # libgcc_s (no libwayland, no libEGL).
      - name: No libc crate, and what the release binary links
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          if cargo tree -p scootbar -e normal --prefix none | grep -q '^libc '; then
            echo "::error title=scootbar depends on the libc crate::find the path with: cargo tree -p scootbar -e normal -i libc"
            cargo tree -p scootbar -e normal -i libc
            exit 1
          fi
          echo "ok: no libc crate in scootbar's normal dependency tree"
          # Weighed alone, never in a --workspace build (feature unification).
          RUSTFLAGS="-D warnings" cargo build --release -p scootbar
          echo "release binary: $(stat -c %s target/release/scootbar) bytes (stripped)"
          ldd target/release/scootbar
          extra=$(ldd target/release/scootbar | awk '{ print $1 }' | grep -vE '^(linux-vdso|libc\.so|libm\.so|libgcc_s\.so|/)' || true)
          if [ -n "$extra" ]; then
            echo "::error title=scootbar links a library beyond std's::$(echo "$extra" | tr '\n' ' ')"
            exit 1
          fi
          echo "ok: links only what std links"

      # The fuzz targets (crates/scootbar/fuzz, its own workspace, which no
      # step above compiles) for a fixed budget: a fixed number of runs from
      # a fixed seed, so a run is the same run every time, from the seed
      # corpus and every past finding (`regressions/`). Compiling them is
      # half the point: they build scootbar's parsers by `#[path]`, so a
      # refactor that breaks those includes fails here, not on the next
      # person to fuzz. The stable tests replay the same files through the
      # same checks in every run above; this is what mutates them. Stable
      # toolchain, no sanitizer (`-s none`), as the fuzz README runs it;
      # cargo-fuzz from the pinned nixpkgs. A finding prints its input in
      # base64, since the runner's disk is gone after the job.
      - name: Fuzz targets, a fixed budget
        shell: nix develop --command bash -euo pipefail {0}
        run: |
          fuzz=$(nix build --inputs-from . nixpkgs#cargo-fuzz --no-link --print-out-paths)
          export PATH="$fuzz/bin:$PATH"
          scratch="$RUNNER_TEMP/scootbar-fuzz"
          mkdir -p "$scratch/format" "$scratch/tzif" "$scratch/payload" "$scratch/volume" "$scratch/network" "$scratch/dbus" "$scratch/artifacts"
          cd crates/scootbar
          # cargo-fuzz has no `--locked` to pass on, so the fuzz workspace's
          # own lock file is held to it here: a stale one fails the step
          # instead of being quietly rewritten by the build below.
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          run() {
            local target=$1; shift
            if ! cargo fuzz run -s none --target-dir "$GITHUB_WORKSPACE/target/scootbar-fuzz" "$target" \
                "$scratch/$target" "fuzz/corpus/$target" "fuzz/regressions/$target" -- \
                -seed=1 -timeout=10 -artifact_prefix="$scratch/artifacts/" "$@"; then
              for found in "$scratch"/artifacts/*; do
                [ -f "$found" ] || continue
                echo "::error title=scootbar fuzz finding ($target)::$(basename "$found")"
                echo "$(basename "$found"), base64:"
                base64 -w0 "$found"; echo
              done
              return 1
            fi
          }
          run format -runs=1000000 -max_len=512
          run tzif -runs=5000000 -max_len=70000
          run payload -runs=2000000 -max_len=5000
          run volume -runs=2000000 -max_len=70000
          run network -runs=2000000 -max_len=70000
          run dbus -runs=1000000 -max_len=70000

      - name: Save the cargo cache
        # Same condition as the Linux job's save; see the comment there.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # scootbar against a live `scoot --headless` (crates/scootbar/tests/bar.rs:
  # a bar per output, its zone and margins, pixels at fractional scales and
  # a live scale change, zero idle wakeups, exit when the compositor goes)
  # and a headless sway (tests/hotplug.rs: outputs plugged and unplugged at
  # runtime, zero outputs, a hotplug storm with no leak), and the clock on
  # both (tests/clock.rs: the time read back off screenshots, per-module
  # damage, no wakeup between minutes, the font refusals). Runs when either
  # side changes, since each can break the other's end-to-end run.
  # `SCOOTBAR_REQUIRE_SCOOT` and `SCOOTBAR_REQUIRE_SWAY` turn the tests'
  # skips into failures, so this job cannot go green by skipping; the
  # first also requires `foot` (the dev shell's), which places a window
  # beside the bar.
  scootbar-integration:
    name: scootbar on headless scoot and sway
    needs: changes
    # Fail open: skipped only when both sides are explicitly unchanged.
    if: ${{ !cancelled() && (needs.changes.outputs.scoot != 'false' || needs.changes.outputs.scootbar != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Create XDG_RUNTIME_DIR
        run: |
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >>"$GITHUB_ENV"

      # Restore-only, from the Linux job's entries: they hold the Smithay
      # build this job needs.
      - name: Restore the cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linux-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}-
            linux-cargo-

      - name: Build scoot and scootbar
        shell: nix develop --command bash -euo pipefail {0}
        run: cargo build -p scoot -p scootbar

      - name: Fetch sway
        run: |
          sway=$(nix build --inputs-from . nixpkgs#sway --no-link --print-out-paths)
          echo "SCOOTBAR_TEST_SWAY=$sway/bin/sway" >>"$GITHUB_ENV"

      - name: Integration tests, compositors required
        shell: nix develop --command bash -euo pipefail {0}
        env:
          SCOOTBAR_REQUIRE_SCOOT: "1"
          SCOOTBAR_REQUIRE_SWAY: "1"
        run: |
          cargo nextest run -p scootbar --test bar --test hotplug --test clock --test icons --test popup --test tooltip --test visibility --test workspaces --no-fail-fast
          cargo test -p scootbar --test bar --test hotplug --test clock --test icons --test popup --test tooltip --test visibility --test workspaces
          # The PNG icon's end-to-end test is compiled only with its
          # feature, which the default build leaves out.
          cargo nextest run -p scootbar --features icon-image --test icons --no-fail-fast
