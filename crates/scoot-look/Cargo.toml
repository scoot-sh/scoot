[package]
name = "scoot-look"
description = "Look format for the scoot desktop: look.toml schema, value grammar, validation and pure renderers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Pure by contract (dev/research/live-looks-design.md section 3.3): no
# Wayland, no fontconfig, no image decoder, no process spawning. Only the
# workspace's existing serde and toml, so this adds no new package to the
# tree and builds on macOS beside scoot-core. Effectful checks (font
# resolution, wallpaper bytes, the apps' strict parsers) live in the callers,
# not here. Nothing here needs Nix: a plain binary install renders and
# validates looks with this crate and plain files.
[dependencies]
serde.workspace = true
toml = "1"

[[bin]]
name = "scoot-look"
path = "src/main.rs"
