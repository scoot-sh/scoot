[package]
name = "scoot-look"
description = "Look format for the scoot desktop: look.toml schema, value grammar, validation and pure renderers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Pure by contract (dev/research/live-looks-design.md section 3.3): no
# Wayland, no fontconfig, no image decoder, no process spawning. Only the
# workspace's existing serde and toml, so this adds no new package to the
# tree and builds on macOS beside scoot-core. Effectful checks (font
# resolution, wallpaper bytes, the apps' strict parsers) live in the callers,
# not here. Nothing here needs Nix: a plain binary install renders and
# validates looks with this crate and plain files.
[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = "1"
# The state module's gated reads, lock and atomic writes use the same
# `rustix` the Wayland crates already pull in (`fs` for those, `process`
# for the euid behind the private-dir ownership refusal); `main.rs` uses
# it to open `look.toml` without blocking, so a FIFO or device can never
# hang validation. Still no Wayland, fontconfig, image decoder or process
# spawning: the pure contract above holds.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }

[[bin]]
name = "scoot-look"
path = "src/main.rs"

# Tests only: scratch dirs as `TempDir` guards, so a run leaves no
# `/tmp/scoot-look-state-*` dirs behind. `tempfile` is already in the
# workspace lockfile (via `scootctl`), so this adds no new package.
[dev-dependencies]
tempfile = "3"
