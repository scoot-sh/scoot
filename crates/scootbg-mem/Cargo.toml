[package]
name = "scootbg-mem"
description = "The only unsafe code in scootbg: its allocator, wl_shm buffers and signal wait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Linux only, like the daemon it serves: on any other target the crate is
# empty (see `src/lib.rs`), so `cargo check --workspace` still passes there.
#
# `rustix` with its `linux_raw` backend (the default on Linux): raw syscalls,
# no `libc` crate and no C. `mm` for the allocator's and the shm buffer's
# mappings, `fs` for the sealed memfd, `pipe` for the signal wake-up, and
# `runtime` for the two signal-mask calls, which rustix has nowhere else.
# Decided in docs/scootbg/backlog/resolved/dependencies-done.md (§6b, §9,
# §11); `runtime` is this crate's own addition, see src/signal.rs.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "mm", "fs", "pipe", "runtime"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Every `unsafe` block and impl carries a `// SAFETY:` argument, one
# operation per block so each argument covers exactly one thing.
[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
