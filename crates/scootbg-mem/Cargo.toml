[package]
name = "scootbg-mem"
description = "The only unsafe code in scootbg and scootbar: an allocator, wl_shm buffers and a read-only file mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Linux only, like the daemons it serves (`src/lib.rs` says so on any
# other target; the macOS CI job leaves it out).
#
# `rustix` with its `linux_raw` backend (the default on Linux): raw syscalls,
# no `libc` crate and no C. `mm` for the allocator's and the shm buffer's
# mappings, `fs` for the sealed memfd. Decided in
# docs/scootbg/backlog/resolved/dependencies-done.md (§6b, §9, §11).
[dependencies]
rustix = { version = "1", default-features = false, features = ["std", "mm", "fs"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Every `unsafe` block and impl carries a `// SAFETY:` argument, one
# operation per block so each argument covers exactly one thing.
[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
