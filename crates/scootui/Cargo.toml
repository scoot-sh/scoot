[package]
name = "scootui"
description = "Shared drawing, widgets, icons, Wayland scaffolding and the control socket for scootbar, scootnotify, scootlaunch and scootgreet: canvas, text, theme, popups, icon rasterization, the per-output model, the poll loop's Wayland primitives and the msg server half"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["widgets", "icons"]
# The popup's pure half and the ellipsis cut.
widgets = []
# Path and cached icons (no PNG decoder, no tray pixmaps).
icons = []
# The text entry, virtualized list, inline selector and focus chain the
# launcher and the greeter type and pick through (scootlaunch's query
# entry plus ranked list, scootgreet's password entry plus user and
# session selectors). Pure state machines plus paint into the caller's
# canvas: no Wayland, no I/O, no new dependency. Implied by no other
# feature, so scootbar (which never enables it) links and draws exactly
# what it did before.
entry = []
# PNG image icons, decoded once and cached.
png = ["dep:png", "icons"]
# Tray pixmaps, scaled through the shared resampler.
tray = ["icons"]
# The on-demand surfaces the shell apps show content on: one overlay
# layer surface created when there is content and destroyed with its
# buffers unmapped when empty (scootnotify's stack, scootlaunch's panel),
# and a full-screen xdg_toplevel kind (scootgreet, where the host has no
# layer-shell). The Wayland glue plus the pure lifecycle and the
# named-memfd buffer pool.
surfaces = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]
# The poll loop's Wayland primitives (flush, the gone check, the read
# after a poll): the Wayland half of the daemon loop, which every shell
# app's loop runs.
wayland = ["dep:wayland-client", "rustix/event"]
# The control socket's server half (accepting, bounding and servicing
# connections), the claim, line framing and socket paths, with the socket
# name a parameter of the app's (`scootbar`, `scootnotify`): the `msg`
# interface every shell daemon serves. The error lines use the same JSON
# encoding as the apps' own reply writers.
control = ["rustix/event", "rustix/net", "dep:serde", "dep:serde_json"]
# The seat keyboard: the keymap fd with a size cap, modifiers with Caps
# and Num Lock, key repeat on one timerfd, keysyms and UTF-8 into a
# caller-supplied buffer, and Compose. Needs `wayland` for the seat
# binding; links libxkbcommon (see `keyboard`'s docs for the runtime
# dependency). Implied by no other feature: an app that does not type
# pays nothing for it, and in particular links no new library.
keyboard = ["wayland", "dep:xkbcommon", "rustix/time"]
# The headless-compositor harness the apps' integration tests share (the
# scoot and sway sessions, the screenshot readers). Test support only:
# never enabled in a shipped binary.
test-support = [
  "wayland",
  "dep:wayland-protocols-wlr",
  "dep:base64",
  "dep:serde_json",
  "dep:png",
  "rustix/process",
]

[dependencies]
scoot-rt.workspace = true
scootbg-mem.workspace = true
ab_glyph = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
png = { version = "0.18", optional = true }
# The Wayland connection and its errors, for `wayland` (and through it
# `test-support`), and for the `surfaces` glue: plain `wayland-client` on
# its pure-Rust backend, as scootbar, so nothing links libwayland.
wayland-client = { version = "0.31", optional = true }
# `xdg_shell` for the `surfaces` feature's full-screen toplevel kind (plus
# the staging viewporter and fractional scale its draws are sized
# through): plain protocols, as scootbar binds them.
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
# `zwlr_layer_shell_v1` for the `surfaces` feature's layer kind, and
# the screencopy manager the `test-support` harness reads sway's pixels
# through: one crate for both, as scootbar's.
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
# libxkbcommon bindings and the XKB state machine, for `keyboard`: the
# reference XKB implementation every compositor and toolkit uses (see the
# `keyboard` docs for why it, and the runtime dependency it brings).
# Default features off: its `wayland` feature is only the memmap-based
# `new_from_fd`, which this crate does not use (the keymap fd is read with
# an explicit size cap instead, so hostile sizes fail before mapping).
xkbcommon = { version = "0.9", default-features = false, optional = true }
base64 = { workspace = true, optional = true }
# The control socket's error lines, encoded exactly as the apps' own reply
# writers (behind `control`), and the harness's session JSON (behind
# `test-support`): nothing else here touches JSON.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# The headless keyboard test's mapped surface (`xdg_shell`) and its held
# key (`zwp_virtual_keyboard_v1`). Test-only: never in a shipped binary.
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }

[[test]]
name = "surfaces"
required-features = ["surfaces", "test-support"]
