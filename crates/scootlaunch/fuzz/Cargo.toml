# `cargo fuzz` targets over the parsers of outside input: the desktop
# entry parser and the Exec expander. Test tooling only: never part of
# the shipped binary, and never a member of the repository's workspace
# (the `[workspace]` table below makes this its own), so `cargo build
# --workspace`, nextest, clippy and the flake's builds never compile
# it. How to run it: README.md here.
[package]
name = "scootlaunch-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

# The two files are compiled by `#[path]` from scootlaunch's own
# source, and use nothing but `std`.
[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exec"
path = "fuzz_targets/exec.rs"
test = false
doc = false
bench = false

# Only symbols, for readable crash stacks.
[profile.release]
debug = 1
