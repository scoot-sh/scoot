[package]
name = "scoot"
description = "A scrolling-tiling Wayland compositor that runs without a GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `gpu-scanout` compiles everything that allocates GPU buffers through GBM:
# the `--tty` GPU scanout tier (`DrmCompositor` over a GBM swapchain -- see
# `compositor/tty/`) and `--nested`'s dma-buf presentation to its host
# (`compositor/nested/gpu.rs`). It is **off by default on purpose**. The
# name predates the second user; one feature per link-time cost is the
# honest axis, and a second feature for the same libgbm would double the
# packaging matrix (`packages.scoot-gpu`) for nothing.
#
# Unlike `renderer_gl`, which reaches libEGL/libGLESv2 through `dlopen` and so
# costs a GPU-free machine nothing, Smithay's `backend_gbm` is a real
# *link-time* dependency on libgbm: with it enabled the produced binary
# carries `libgbm.so.1` in its `DT_NEEDED` list and will not start at all
# where that library is absent. GPU-free operation on webtop/no-GPU boxes is a
# fixed project decision (see `CLAUDE.md`), so the default build must not link
# it -- `cargo build` keeps producing a binary that runs anywhere, and a
# distribution targeting real hardware opts in with
# `--features gpu-scanout`.
#
# Off by default does not mean unexercised: the standard verification set is
# run twice, once per feature flavour, and `ldd` on both binaries is the proof
# that the default one really is free of libgbm.
#
# `xwayland` compiles the opt-in XWayland skeleton (`compositor/xwayland/` --
# an X11 server inside the session, off by default behind `--xwayland` and
# `[xwayland] enabled`, default sessions byte-identical). Unlike
# `gpu-scanout` above this adds no link-time system library (Smithay's
# `xwayland` feature pulls pure-Rust `x11rb` -- the X protocol over a socket
# -- plus `encoding_rs` and `scopeguard`), so the `ldd` pair this re-proves
# per change is expected to show *no* new `DT_NEEDED` entry on either side;
# the cost is binary size and the runtime `Xwayland` binary on `PATH`, which
# is why the session knob stays opt-in (see `docs/protocols.md`'s trust
# note: any X client can keylog/snoop by design).
[features]
default = []
gpu-scanout = ["smithay/backend_gbm"]
xwayland = ["smithay/xwayland"]

[dependencies]
scoot-core.workspace = true
scoot-ipc = { workspace = true, features = ["core"] }
scootctl.workspace = true
serde_json.workspace = true

# libinput-sys (unlike libseat-sys/udev-sys/xkbcommon-sys, which all use
# pkg-config internally) has no build.rs logic to locate libinput's shared
# library, so on NixOS the final link step fails with "cannot find -linput"
# even though `pkg-config --exists libinput` succeeds -- the .pc file points
# at a real /nix/store path that's on no default linker search path. build.rs
# adds that search path itself so `cargo build` keeps working with no extra
# environment setup, matching every other dependency here. Same version
# already resolved transitively (every pkg-config-based sys crate above pulls
# it in), so this adds no new version to the tree.
#
# Deliberately *not* under a `[target.'cfg(target_os = "linux")']` table:
# build-dependencies compile for the host doing the build, never the target
# being built for, so gating one behind the target OS excludes it whenever
# the host itself isn't Linux -- e.g. this crate's own dev machine -- no
# matter what's being built. `pkg-config` itself is a portable Rust crate
# that builds fine on any host (it just won't find a Linux system library to
# probe when run elsewhere); the actual Linux-only behavior is already
# correctly handled by build.rs's own runtime `CARGO_CFG_TARGET_OS` check.
[build-dependencies]
pkg-config = "0.3"

# The compositor is Linux-only; `scoot msg` builds everywhere, so the CLI can
# drive a VM from a Mac.
[target.'cfg(target_os = "linux")'.dependencies]
pixman = "0.2"
png = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# For the config file (compositor/config.rs), which is Linux-only along with
# everything else that depends on `Keybindings`'s smithay `Keysym`s -- see
# that module's doc. `serde` is already in the tree via scoot-ipc, at the
# same version pinned in workspace.dependencies, so this doesn't add a
# second incompatible copy.
serde.workspace = true
toml = "1"
# For --nested: scoot is itself a Wayland *client* of a host compositor,
# alongside being a server to its own. Same wayland-client/wayland-protocols
# versions Smithay itself already pins internally (for its own optional,
# unused-by-us winit/x11 backends), so this can't create a resolver conflict.
# "staging" is for the ext-data-control-v1 client bindings the selection
# tests drive; "unstable" is for the primary-selection ones. Smithay already
# enables both (plus "server") for its own protocol states, so this adds no
# new version to the tree, just names the features this crate uses directly.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
calloop-wayland-source = "0.4"
# For the memfd + mmap behind the host-side wl_shm buffers (nested/buffers.rs)
# -- same version already resolved transitively via wayland-backend, so this
# adds no new version to the tree, just a direct dependency on one already
# there. "process" is for `geteuid` and "rand" for `getrandom` in
# ipc/listener.rs, neither of which has a std equivalent; both add a feature to
# a crate already here, not a crate (neither pulls in anything of its own).
rustix = { version = "1", features = ["fs", "mm", "process", "rand"] }
# Parses the xcursor files of whatever cursor theme is installed on the
# machine, for cursor/theme.rs. Nothing is vendored or shipped: this reads the
# user's own theme at runtime, which is what sway/niri/anvil do and carries
# none of the license obligation *shipping* a theme would (see that module's
# doc). MIT-licensed, no dependencies of its own, and the same crate and major
# version Smithay's own anvil uses against this pinned rev.
xcursor = "0.3"
# For `SO_PEERCRED` in ipc/listener.rs -- see `peer_uid`'s doc for why neither
# std nor rustix can answer that one question today. Already in the tree
# transitively (rustix, smithay, wayland and every sys crate here depend on
# it), so this adds a direct dependency, not a crate.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# For compositor/config.rs's tests, which write real temp files to exercise
# `load`'s file-reading paths end to end. Already in the tree transitively
# (smithay itself depends on it), so this adds no new version, just a
# direct dev-dependency on one already resolved.
tempfile = "3"
# The X11 client half of compositor/xwayland/tests.rs: those tests drive a
# real X client (create, map, override-redirect map) against the live
# XWayland server to pin the Phase-1 boundary -- the client connects and
# maps, and nothing enters the core. The same version Smithay itself pins
# (0.13.0 at the pinned rev), so under the `xwayland` feature this unifies
# with the copy already in the tree rather than adding a second one; plain
# `connect` + core protocol needs no extra features.
x11rb = "0.13"
# The *client* half of input-method-v2, for
# compositor/input_method/tests.rs: those tests drive a real input method
# (the privileged half of the IME pair) through a real compositor, which is
# the only way to make an IME popup exist at all. Smithay already pins this
# exact crate (with only its "server" feature) for its own input-method
# support, so this adds a feature to a crate already in the tree, not a new
# dependency.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# The *client* half of wlr-layer-shell, for compositor/layer_shell/tests.rs:
# those tests drive a real layer-shell client through a real compositor
# rather than calling the handler directly. Smithay already pins this exact
# crate (with only its "server" feature) for its own layer-shell support, so
# this adds a feature to a crate already in the tree, not a new dependency.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# A scoot-sh fork, not upstream: upstream's pinned rev `0ff00983` plus
# exactly one commit (`43f50eb2`, branch `scoot/syncobj-timeline-drop`) that
# adds a `Drop` for `DrmTimelineDeviceSpecific`. Without it every
# `wp_linux_drm_syncobj_manager_v1.import_timeline` leaks a kernel syncobj
# handle on the import device until scoot exits -- ~80 B of kernel slab per
# import and ~200 B per abandoned acquire wait, which a client can drive at
# wire speed (see `docs/backlog/resolved/syncobj-handle-leak-done.md`).
# Upstream status (checked 2026-09-24): not fixed on Smithay `master`
# (79bbed5e1 has no such `Drop`) and not in any release (v0.7.0 predates
# `0ff00983`); an upstream PR is the user's to file. Repin to upstream --
# and drop the fork -- as soon as a Smithay rev carrying the fix exists.
# Verify claims about Smithay's behaviour against this fork rev.
[target.'cfg(target_os = "linux")'.dependencies.smithay]
git = "https://github.com/scoot-sh/smithay"
rev = "43f50eb257a692a5e94a1a719641f121b3c849ab"
default-features = false
# backend_drm/backend_libinput/backend_udev/backend_session_libseat are for
# --tty: real DRM/KMS scanout, libinput device handling, and VT/session
# management via seatd. backend_gbm is deliberately *not* here -- it is
# reached only through this crate's own `gpu-scanout` feature (see the
# `[features]` table above), because it is a link-time libgbm dependency and
# the default build must keep running on a machine with no GPU stack at all.
# Without that feature the `--tty` backend presents through DRM dumb buffers;
# see `tty/dumb.rs`'s module doc.
#
# renderer_gl is the optional `--renderer gles` pipeline
# (compositor/render/gles.rs). It is *not* behind a Cargo feature of our own
# and does not need to be: it pulls backend_egl, which loads libEGL and
# libGLESv2 through `libloading` at runtime, so enabling it adds no link-time
# dependency and a build of this crate still runs on a machine with no GL
# stack installed at all (`--renderer gles` is what fails there, at startup,
# with a message -- not the build, and not the default pixman path).
features = [
    "desktop",
    "wayland_frontend",
    "renderer_pixman",
    "renderer_gl",
    "backend_drm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
]
