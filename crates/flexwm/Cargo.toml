[package]
name = "flexwm"
description = "A scrolling-tiling Wayland compositor that runs without a GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flexwm-core.workspace = true
flexwm-ipc = { workspace = true, features = ["core"] }
serde_json.workspace = true

# libinput-sys (unlike libseat-sys/udev-sys/xkbcommon-sys, which all use
# pkg-config internally) has no build.rs logic to locate libinput's shared
# library, so on NixOS the final link step fails with "cannot find -linput"
# even though `pkg-config --exists libinput` succeeds -- the .pc file points
# at a real /nix/store path that's on no default linker search path. build.rs
# adds that search path itself so `cargo build` keeps working with no extra
# environment setup, matching every other dependency here. Same version
# already resolved transitively (every pkg-config-based sys crate above pulls
# it in), so this adds no new version to the tree.
#
# Deliberately *not* under a `[target.'cfg(target_os = "linux")']` table:
# build-dependencies compile for the host doing the build, never the target
# being built for, so gating one behind the target OS excludes it whenever
# the host itself isn't Linux -- e.g. this crate's own dev machine -- no
# matter what's being built. `pkg-config` itself is a portable Rust crate
# that builds fine on any host (it just won't find a Linux system library to
# probe when run elsewhere); the actual Linux-only behavior is already
# correctly handled by build.rs's own runtime `CARGO_CFG_TARGET_OS` check.
[build-dependencies]
pkg-config = "0.3"

# The compositor is Linux-only; `flexwm msg` builds everywhere, so the CLI can
# drive a VM from a Mac.
[target.'cfg(target_os = "linux")'.dependencies]
pixman = "0.2"
png = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# For the config file (compositor/config.rs), which is Linux-only along with
# everything else that depends on `Keybindings`'s smithay `Keysym`s -- see
# that module's doc. `serde` is already in the tree via flexwm-ipc, at the
# same version pinned in workspace.dependencies, so this doesn't add a
# second incompatible copy.
serde.workspace = true
toml = "1"
# For --nested: flexwm is itself a Wayland *client* of a host compositor,
# alongside being a server to its own. Same wayland-client/wayland-protocols
# versions Smithay itself already pins internally (for its own optional,
# unused-by-us winit/x11 backends), so this can't create a resolver conflict.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop-wayland-source = "0.4"
# For the memfd + mmap behind the host-side wl_shm buffers (nested/buffers.rs)
# -- same version already resolved transitively via wayland-backend, so this
# adds no new version to the tree, just a direct dependency on one already
# there. "process" is for `geteuid` and "rand" for `getrandom` in
# ipc/listener.rs, neither of which has a std equivalent; both add a feature to
# a crate already here, not a crate (neither pulls in anything of its own).
rustix = { version = "1", features = ["fs", "mm", "process", "rand"] }
# For `SO_PEERCRED` in ipc/listener.rs -- see `peer_uid`'s doc for why neither
# std nor rustix can answer that one question today. Already in the tree
# transitively (rustix, smithay, wayland and every sys crate here depend on
# it), so this adds a direct dependency, not a crate.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# For compositor/config.rs's tests, which write real temp files to exercise
# `load`'s file-reading paths end to end. Already in the tree transitively
# (smithay itself depends on it), so this adds no new version, just a
# direct dev-dependency on one already resolved.
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "0ff00983b6007257a7a161a4fe8b14a778e2ac8f"
default-features = false
# backend_drm/backend_libinput/backend_udev/backend_session_libseat are for
# --tty: real DRM/KMS scanout, libinput device handling, and VT/session
# management via seatd. Deliberately not backend_gbm -- see tty/buffers.rs's
# module doc for why this backend uses dumb buffers, not GBM, in this rev.
features = [
    "desktop",
    "wayland_frontend",
    "renderer_pixman",
    "backend_drm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
]
