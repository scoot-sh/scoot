# `cargo fuzz` targets over the parsers of outside input: the clock's format
# string (`--clock-format`) and TZif reader (`/etc/localtime`, `TZ`), the
# update payload of the `exec` and `push` modules, and the volume module's
# PulseAudio-protocol frames (the sound server's socket). Test tooling only: never part of the shipped binary, and never a
# member of the repository's workspace (the `[workspace]` table below makes
# this its own), so `cargo build --workspace`, nextest, clippy and the
# flake's builds never compile it. How to run it: README.md here.
[package]
name = "scootbar-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

# The two files are compiled by `#[path]` from scootbar's own source, and
# use nothing but `std`.
[dependencies]
libfuzzer-sys = "0.4"
# The payload parser reads JSON (`serde_json`, as scootbar does).
serde_json = "1"

[[bin]]
name = "format"
path = "fuzz_targets/format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "payload"
path = "fuzz_targets/payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tzif"
path = "fuzz_targets/tzif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "volume"
path = "fuzz_targets/volume.rs"
test = false
doc = false
bench = false

[[bin]]
name = "network"
path = "fuzz_targets/network.rs"
test = false
doc = false
bench = false

# Only symbols, for readable crash stacks.
[profile.release]
debug = 1
