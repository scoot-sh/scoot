[package]
name = "scootbar"
description = "Status bar for Wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Linux only, as scootbg: it never runs on a Mac, and does not build there
# (`scootbg-mem` says so; the macOS CI job leaves it out). The Wayland
# crates, `rustix` and `scootbg-mem` are already in the workspace for
# scootbg, chosen there by measurement (docs/scootbg/backlog/resolved/dependencies-done.md);
# `ab_glyph` is scootbar's own, chosen in its record,
# docs/scootbar/backlog/resolved/dependencies-done.md (§1).

# One feature per module, so the smallest build has none of a module's code
# (`src/modules/mod.rs` says how a module is added). A build without any
# module draws a plain bar and needs no font. `icon-image` is the one
# feature that is not a module: it is an optional decoder (below).
[features]
default = ["clock", "workspaces", "window-title", "volume", "microphone", "network", "brightness", "battery", "tray", "media", "bluetooth", "button", "push", "exec", "popup", "power"]
clock = []
workspaces = []
window-title = []
# The default sink's level and mute, and the default source's (`microphone`,
# which shares the code): a native PulseAudio-protocol client, no libpulse.
volume = []
microphone = []
# Link state, WiFi name and signal over rtnetlink and nl80211, no daemon.
network = []
# The panel backlight's level, scroll to adjust: sysfs read on kernel
# uevents, absolute writes where the bar may write
# (docs/scootbar/backlog/brightness-module.md).
brightness = []
# The batteries' charge and state: sysfs read on kernel uevents, with a
# slow re-read while discharging for drivers whose capacity steps are
# silent (docs/scootbar/backlog/battery-module.md).
battery = []
# Popups: a module's declarative content (a slider, buttons) drawn in an
# `xdg_popup` parented to the bar, opened by a click bound to `popup`. Not a
# module: the code is the bar's own (`src/popup/`, `src/daemon/popup.rs`),
# and a build without it has none of it, nor `xdg_wm_base`
# (docs/scootbar/backlog/resolved/popups-done.md).
popup = []
# The system tray: StatusNotifierItem watcher and host over the shared
# hand-rolled D-Bus client, pixmap icons first
# (docs/scootbar/backlog/tray.md).
tray = []
# What the players on the session bus are playing, and play/pause, next and
# previous, over MPRIS: a client of the shared D-Bus client, signals only
# (docs/scootbar/backlog/resolved/media-module-done.md).
media = []
# Adapter power and connected devices over BlueZ, on the system bus: a
# client of the shared D-Bus client, signals only
# (docs/scootbar/backlog/bluetooth-module.md).
bluetooth = []
# Lock, log out, suspend, reboot and shut down from a popup menu with a
# confirm step, over logind on the system bus where it applies
# (docs/scootbar/backlog/power-menu.md).
power = []
# The three modules the config defines by name (`[button.NAME]`,
# `[push.NAME]`, `[exec.NAME]`): extend the bar without Rust. `push` and
# `exec` share the update payload (`src/modules/payload.rs`).
button = []
push = []
exec = []
# PNG icons (`[clock] icon-image`): the `png` decoder, and nothing of it
# without the feature. Not a module, and not in `default`: the decoder is
# +115 KB on a 1.48 MB bar (release, `lto = "fat"`, stripped, measured in
# site/src/content/docs/scootbar/configure.md#icons) for a picture where a path icon needs none, so
# the default build stays inside the resource ratchet
# (docs/scootbar/backlog/lightest.md). Built in with `--features
# icon-image`, or the Nix module's `features` list.
icon-image = ["dep:png"]

[dependencies]
# The typo guesser and the docs URL behind `--help`: the one copy every
# binary shares, so the help cannot drift from the client's and a domain
# move is one edit. (Only `suggest`, `DOCS_URL` and `docs_tail` are used;
# none of the protocol reaches the binary: `src/scoot.rs` still writes its
# request by hand, and a test checks it against scoot-ipc's encoding.)
scoot-ipc.workspace = true
# The sealed-memfd `wl_shm` buffer, scootbg's, so scootbar has no `unsafe`
# of its own (`#![forbid(unsafe_code)]` in `src/main.rs`).
scootbg-mem.workspace = true
# The Wayland client, plain, no toolkit, on its pure-Rust backend: nothing
# links libwayland.
wayland-client = "0.31"
# `wp_viewporter` and `wp_fractional_scale_manager_v1` (staging): drawing
# at the output's real device pixels at a fractional scale.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# `zwlr_layer_shell_v1`: a bar is a layer surface.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# poll(2), and the clock's timerfd, `statx` of the zone file and
# `clock_gettime`, through raw syscalls, no `libc` crate: the same `rustix`
# the Wayland crates already pull in.
rustix = { version = "1", default-features = false, features = ["std", "event", "fs", "net", "time", "process"] }
# Text: the M0 choice (its record, §1). Lazily parsed over the font's bytes,
# so memory follows what is drawn; grayscale coverage, no hinting.
ab_glyph = "0.2"
# The config file (`bar.toml`) and the control socket's line-framed JSON:
# the workspace's existing versions, chosen by measurement
# (docs/scootbar/spikes/config-parser.md, docs/scootbg's dependency
# record §5). `toml` adds no new package to the tree (`scoot` pins it).
serde.workspace = true
serde_json.workspace = true
toml = "1"
# The PNG icon's decoder, behind the `icon-image` feature: the `png` scootbg
# already carries (same version, same lock entry, MIT OR Apache-2.0), its
# default features, and no new package in the tree.
png = { version = "0.18", optional = true }

# The integration tests read screenshots back: scoot's arrive as base64 PNG
# over its IPC, sway's through a small wlr-screencopy client into a memfd.
# Dev-only: none of it reaches the binary's dependency tree.
[dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process", "fs", "pipe", "time"] }
base64.workspace = true
png = "0.18"
serde_json.workspace = true
