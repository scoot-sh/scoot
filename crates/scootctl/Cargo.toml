[package]
name = "scootctl"
description = "Client library behind `scoot msg`, the remote-control client for the scoot scrolling-tiling Wayland compositor"
# The repository's one version (docs/versioning.md).
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scoot-ipc.workspace = true
scoot-look.workspace = true
serde_json.workspace = true
# `look export`/`install` tarballs: plain ustar, read entry by entry (never
# `unpack`), every entry re-validated against the trust boundary.
tar = "0.4"
# The install-time URL wallpaper fetch: the `sha256` pin check and the
# download-cache file name (hex of the URL's hash, as scootbg names it).
sha2 = "0.10"
toml = "1"
# The uid behind the `/run/user/<uid>` fallback (see `look/reload.rs`)
# and the gated file reads (see `look/apply.rs`): no Wayland, no
# fontconfig, no image decoder, no process spawning.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process", "event"] }

[dev-dependencies]
tempfile = "3"
