[package]
name = "scootctl"
description = "Client library behind `scoot msg`, the remote-control client for the scoot scrolling-tiling Wayland compositor"
# The repository's one version (docs/versioning.md).
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scoot-ipc.workspace = true
scoot-look.workspace = true
serde_json.workspace = true
toml = "1"
# The uid behind the `/run/user/<uid>` fallback (see `look/reload.rs`)
# and the gated file reads (see `look/apply.rs`): no Wayland, no
# fontconfig, no image decoder, no process spawning.
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
