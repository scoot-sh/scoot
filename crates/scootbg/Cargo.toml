[package]
name = "scootbg"
description = "Wallpaper daemon for Wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Every dependency below was chosen by measurement; the record, with the
# alternatives and their numbers, is
# docs/scootbg/backlog/resolved/dependencies-done.md. Linux only: it never
# runs on a Mac, and does not build there (`scootbg-mem` says so; the
# macOS CI job leaves it out).
[dependencies]
# The typo guesser and the docs URL behind `--help`: the one copy every
# binary shares, so the help cannot drift from the client's and a domain
# move is one edit. (Only `suggest`, `DOCS_URL` and `docs_tail` are used;
# none of the protocol reaches the binary.)
scoot-ipc.workspace = true
# The only `unsafe` scootbg has: the large-allocation global allocator,
# and the wl_shm buffer mapping (§6b, §11).
scootbg-mem.workspace = true
# The Wayland client, plain, no toolkit: 41 KB and 6 s of build lighter
# than smithay-client-toolkit at identical idle cost (§1). Its pure-Rust
# `rs` backend is the default; the C-bringing `client_system` feature of
# `wayland-backend` stays off, so nothing links libwayland.
wayland-client = "0.31"
# `wp_viewporter`, `wp_single_pixel_buffer_manager_v1` (staging),
# `wp_fractional_scale_manager_v1` (staging), all client side (§1), and
# `zxdg_output_manager_v1` (unstable), bound only for an output older than
# `wl_output` v4, to learn its name.
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
# `zwlr_layer_shell_v1`, the one protocol scootbg cannot work without (§1).
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# poll(2), flock(2) and a non-blocking connect probe through raw syscalls, no `libc`
# crate: the same `rustix` the Wayland crates already pull in (§9).
# `process` for `getuid` (the state directory's owner check); another
# crate in the tree enables it already, so it adds nothing. `rand` for
# `getrandom(2)` (the state file's temporary name): a module of rustix's
# own, no dependency.
rustix = { version = "1", default-features = false, features = ["std", "event", "fs", "net", "process", "rand"] }
# The control socket's line-framed JSON: +74 KB, already workspace
# dependencies, and able to express versioned, tagged replies (§5).
serde.workspace = true
serde_json.workspace = true
# Images: the decoders directly, not through `image`, which costs 139 KB
# more, reads a whole JPEG into memory first (+9.5 MB of peak) and copies
# the whole image to apply EXIF orientation (§2). `zune-jpeg`'s `unsafe` is
# its SIMD kernels, fuzzed upstream; `png` and `image-webp` are
# `forbid(unsafe_code)` (§10).
zune-jpeg = "0.5"
zune-core = "0.5"
png = "0.18"
image-webp = "0.2"
# The scaler: `forbid(unsafe_code)`, 174 ms and +25 MB (the output only) for
# 6000x4000 -> 3840x2160 Lanczos3, against fir's 80 ms / +63 MB and ~650
# `unsafe` sites; the user's choice after both were measured (§3b). Behind
# one function (`image::scale`), so a swap stays contained.
pic-scale-safe = "0.1"

# The integration tests signal the daemon they start and probe its lock,
# and read screenshots back: scoot's arrive as base64 PNG over its IPC
# (decoded with `png`, a normal dependency above), and sway's through a
# small wlr-screencopy client into a memfd (`fs`), read back with `read`.
# Dev-only: the binary itself does none of this, and none of it reaches
# its dependency tree.
[dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }
base64.workspace = true
