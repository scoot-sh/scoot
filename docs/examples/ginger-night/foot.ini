# The "ginger-night" look for foot. The palette is the illustration's own hues:
# near-black field, cream text, ginger and amber, umber and dusty sand.
# `pad` is the room between the text and the window's edge, and `alpha`
# the window's opacity: 0.80 lets the wallpaper show through, 1.0 is fully
# opaque. The font is a name, resolved through fontconfig.
#
#   foot --config docs/examples/ginger-night/foot.ini
#
[main]
font=FiraCode Nerd Font:size=10.5
pad=18x16 center
[cursor]
style=beam
[colors-dark]
alpha=0.80
background=0e0e0e
foreground=f5ead6
regular0=1a1512
regular1=c96a45
regular2=8fa07a
regular3=d08a3a
regular4=7e8aa0
regular5=9a7b6e
regular6=7e9b94
regular7=c9b8a3
bright0=5e4b3f
bright1=e05a4e
bright2=a9b98f
bright3=ffb14b
bright4=93a3b8
bright5=c08a7a
bright6=a8c4b8
bright7=f5ead6
selection-background=4a2c17
selection-foreground=f5ead6
