# The "vinyl sunset" lazygit colors: the illustration's palette, rounded borders, no
# fetch and no update checks. Copy to ~/.config/lazygit/config.yml (lazygit
# also reads ~/.config/lazygit/config.yaml).
gui:
  nerdFontsVersion: "3"
  showBottomLine: false
  showRandomTip: false
  border: rounded
  theme:
    activeBorderColor: ["#FE9949", bold]
    inactiveBorderColor: ["#AA6D5F"]
    selectedLineBgColor: ["#582818"]
    optionsTextColor: ["#FE9949"]
    unstagedChangesColor: ["#D58267"]
    defaultFgColor: ["#F6E8CB"]
git:
  autoFetch: false
  autoRefresh: false
update:
  method: never
