# The "vinyl sunset" Helix theme: the illustration's palette, background left
# transparent for a translucent terminal. Copy to
# ~/.config/helix/themes/scoot-vinyl.toml.
"ui.background" = {}
"ui.text" = "ink"
"ui.text.focus" = { fg = "ink", modifiers = ["bold"] }
"ui.linenr" = "mist"
"ui.linenr.selected" = { fg = "blue", modifiers = ["bold"] }
"ui.cursor" = { fg = "paper", bg = "blue" }
"ui.cursor.primary" = { fg = "paper", bg = "blue" }
"ui.cursorline.primary" = { bg = "#39140f" }
"ui.selection" = { bg = "#582818" }
"ui.statusline" = { fg = "ink", bg = "#411711" }
"ui.statusline.inactive" = { fg = "mist", bg = "#39140f" }
"ui.statusline.normal" = { fg = "paper", bg = "blue", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "paper", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "paper", bg = "purple", modifiers = ["bold"] }
"ui.virtual.indent-guide" = "#411711"
"ui.virtual.ruler" = { bg = "#39140f" }
"ui.menu" = { fg = "ink", bg = "#39140f" }
"ui.menu.selected" = { fg = "paper", bg = "blue" }
"ui.popup" = { bg = "#39140f" }
"ui.help" = { bg = "#39140f" }
"ui.window" = "mist"
keyword = { fg = "red", modifiers = ["bold"] }
"keyword.control" = "red"
function = "blue"
"function.macro" = "teal"
type = "purple"
"type.builtin" = "purple"
constructor = "purple"
string = "green"
"constant.character" = "green"
constant = "yellow"
"constant.numeric" = "yellow"
"constant.builtin" = "yellow"
comment = { fg = "mist", modifiers = ["italic"] }
variable = "ink"
"variable.parameter" = "teal"
"variable.other.member" = "ink"
operator = "red"
punctuation = "slate"
namespace = "teal"
attribute = "teal"
label = "purple"
special = "red"
"markup.heading" = { fg = "blue", modifiers = ["bold"] }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
error = "red"
warning = "yellow"
info = "blue"
hint = "teal"
[palette]
ink = "#f6e8cb"
slate = "#eac985"
mist = "#965c50"
paper = "#270e0a"
blue = "#fe9949"
red = "#d58267"
green = "#b8d26a"
yellow = "#ffd757"
purple = "#95a4d0"
teal = "#adb0cd"
