# The "vinyl sunset" Helix setup: relative line numbers, a cursor line, and the
# scoot-vinyl theme below (transparent background, for a translucent terminal).
# Copy this file to ~/.config/helix/config.toml and themes/scoot-vinyl.toml to
# ~/.config/helix/themes/scoot-vinyl.toml.
theme = "scoot-vinyl"
[editor]
line-number = "relative"
cursorline = true
bufferline = "never"
[editor.indent-guides]
render = true
character = "▏"
[editor.statusline]
left = ["mode", "file-name", "file-modification-indicator"]
right = ["position", "file-type"]
[editor.lsp]
enable = false
