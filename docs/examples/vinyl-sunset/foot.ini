# The "vinyl sunset" look for foot. The palette is the illustration's own hues:
# espresso background, cream text, sunset orange, peach and mauve. `pad` is the
# room between the text and the window's edge, and `alpha` the window's
# opacity: 0.80 lets the wallpaper show through, 1.0 is fully opaque. The font
# is a name, resolved through fontconfig.
#
#   foot --config docs/examples/vinyl-sunset/foot.ini
#
[main]
font=FiraCode Nerd Font:size=10.5
pad=18x16 center
[cursor]
style=beam
[colors-dark]
alpha=0.80
background=270e0a
foreground=f6e8cb
regular0=411711
regular1=c85b37
regular2=a5c643
regular3=da973e
regular4=6a7fbd
regular5=b2676d
regular6=878cb6
regular7=eac985
bright0=803a23
bright1=d58267
bright2=b8d26a
bright3=ffd757
bright4=95a4d0
bright5=c89397
bright6=adb0cd
bright7=f6e8cb
selection-background=582818
selection-foreground=f6e8cb
