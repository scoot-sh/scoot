# The "vinyl sunset" look for foot. The palette is the illustration's own hues:
# espresso background, cream text, sunset orange, peach and plum. `pad` is the
# room between the text and the window's edge, and `alpha` the window's
# opacity: 0.80 lets the wallpaper show through, 1.0 is fully opaque. The font
# is a name, resolved through fontconfig.
#
#   foot --config docs/examples/vinyl-sunset/foot.ini
#
[main]
font=FiraCode Nerd Font:size=10.5
pad=18x16 center
[cursor]
style=beam
[colors-dark]
alpha=0.80
background=271a1f
foreground=f1e3c6
regular0=3a2a2e
regular1=c76b47
regular2=8a9a5b
regular3=e59560
regular4=6f7cb3
regular5=b47a8c
regular6=7fa3a0
regular7=ddb590
bright0=604f50
bright1=e0866a
bright2=a6b67a
bright3=fdc58b
bright4=8f9bd0
bright5=d097a8
bright6=9cc0bc
bright7=f6ead2
selection-background=522c27
selection-foreground=f6ead2
