# The "vinyl sunset" prompt for starship, in the illustration's palette, for a dark
# translucent terminal. Point starship at it with STARSHIP_CONFIG, e.g.:
#
#   env STARSHIP_CONFIG=docs/examples/vinyl-sunset/starship.toml bash -i
#
add_newline = false
format = "$directory$git_branch$nix_shell$cmd_duration$character"
[directory]
style = "bold #FE9949"
truncation_length = 3
[git_branch]
symbol = " "
style = "#BE7E84"
format = "[$symbol$branch]($style) "
[nix_shell]
symbol = "󱄅 "
style = "#878CB6"
format = "[$symbol]($style)"
[cmd_duration]
style = "#AA6D5F"
[character]
success_symbol = "[❯](bold #FEC69A)"
error_symbol = "[❯](bold #CE6B4B)"
