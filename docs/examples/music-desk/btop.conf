# The "music desk" btop setup: a light theme with a transparent background, for
# a translucent terminal. Copy to ~/.config/btop/btop.conf. The theme below was
# tuned with btop's paper theme; point color_theme at your own copy of it (or
# any light theme) — the store path it was tuned with is not portable, so it
# is commented out; set it to use the tuned theme (or any light one).
# color_theme = "/path/to/paper.theme"
theme_background = False
truecolor = True
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu mem net"
update_ms = 1500
proc_tree = False
