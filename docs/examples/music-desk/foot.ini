# The "music desk" look for foot. The palette is the wallpaper's own hues: paper
# background, ink text, headphone blue, guitar red, amp green, cassette purple
# and record yellow. `pad` is the room between the text and the window's edge,
# and `alpha` the window's opacity: 0.80 lets the wallpaper show through, 1.0 is
# fully opaque. The font is a name, resolved through fontconfig.
#
#   foot --config docs/examples/music-desk/foot.ini
#
[main]
font=FiraCode Nerd Font:size=10.5
pad=18x16 center
[cursor]
style=beam
[colors-dark]
alpha=0.80
background=fcfbfb
foreground=1a2032
regular0=1a2032
regular1=e0574a
regular2=5f7d3f
regular3=c9962a
regular4=3d579a
regular5=8a73c4
regular6=3f8a9a
regular7=a2a4a8
bright0=4d5463
bright1=ee6f5e
bright2=7a9a55
bright3=e6b440
bright4=5d7ab0
bright5=a493d6
bright6=5aa6b5
bright7=ebebea
selection-background=d7deee
selection-foreground=1a2032
