# The "radial burst" look for scootbar: a floating, rounded, slightly translucent bar
# with the workspaces as circles on the left, the clock in the middle, and status
# icons plus the power menu on the right.
#
#   scootbar daemon --config docs/examples/radial-burst/bar.toml
#
# scootbar needs a font file; it tries a few well-known ones. The module icons
# below need a symbol font (Nerd Font) as a fallback. Name yours if they are
# elsewhere (NixOS keeps fonts in the store):
# [bar]
# font = "/path/to/DejaVuSans.ttf"
# fallback-fonts = ["/path/to/SymbolsNerdFont-Regular.ttf"]

left = ["workspaces"]
center = ["clock"]
right = ["network", "battery", "power"]

[bar]
height = 40
margin = 12          # the layer-shell margin around the bar
radius = 16
opacity = 0.88       # translucent: a little more memory (an ARGB buffer) and no opaque region
font-size = 17
padding = 12
spacing = 14

[colors]
background = "#241721"
foreground = "#fdef1d"
accent = "#31a9e5"
dim = "#99911d"
urgent = "#bf128d"

[workspaces]
pill-shape = "circle"
pill-inset = 7
item-gap = 4         # spaces between the numbers

[clock]
format = "%-I:%M %P"
icon = "\U000F0150"

[network]
icon-wifi = ["\U000F091F", "\U000F0922", "\U000F0925", "\U000F0928"]   # weakest to strongest signal
icon-ethernet = "\U000F0200"
show-text = false    # the icon alone; the SSID and signal stay in the tooltip

[battery]
icon = ["\U000F008E", "\U000F007B", "\U000F007E", "\U000F0081", "\U000F0079"]   # empty to full
icon-charging = "\U000F0084"
icon-full = "\U000F0079"

[power]
icon = "\U000F0425"
on-click = "popup"
