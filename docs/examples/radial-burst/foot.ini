# The "radial burst" look for foot. Colors are the image's own hues spread across the
# ANSI slots (blue and orange make a two-tone fastfetch logo); 16-21 are the six hues
# themselves. `pad` is the room between the text and the window's edge, and `alpha` the
# window's opacity: 0.80 lets the wallpaper show through, 1.0 is fully opaque.
#
#   foot --config docs/examples/radial-burst/foot.ini
#
[colors-dark]
16=99911d
17=31a9e5
18=6d1d98
19=bf128d
20=fa9233
21=fdef1d
alpha=0.80
background=241721
bright0=31a9e5
bright1=bf128d
bright2=99911d
bright3=fdef1d
bright4=31a9e5
bright5=bf128d
bright6=fa9233
bright7=fdef1d
foreground=fdef1d
regular0=241721
regular1=bf128d
regular2=99911d
regular3=fdef1d
regular4=31a9e5
regular5=6d1d98
regular6=fa9233
regular7=fdef1d

[main]
dpi-aware=no
font=DejaVu Sans Mono:size=12
initial-color-theme=dark
pad=32x28
