# The "radial burst" look for scoot: a dark plum background, a thin blue ring around
# the focused window and a thin orange one around the rest, rounded corners, and the
# wallpaper in ../../assets/wallpapers. See README.md in this directory.
#
#   scoot --config docs/examples/radial-burst/scoot.toml
#
# Nothing here is a default: every costly part is opt-in (see "What it costs").
#
# The previews were taken at scale 1.5 on a 2560x1664 panel: uncomment to match.
# [output]
# scale = 1.5

[layout]
gap = 18
# The default thirds and half, new columns at half (index 1), plus a full-width
# column (index 3): before maximize landed this was Super+m's stand-in
# (docs/backlog/resolved/maximize-done.md); Super+m is now the real maximize
# (`toggle-maximize`). `cycle-column-width` steps through all
# four; nothing un-does the full width but another width.
column_widths = [0.3333333333333333, 0.5, 0.6666666666666666, 1.0]
default_column_width = 1

[appearance]
background_color = "#241721"          # shows until the wallpaper is up, and behind it
corner_radius = 16                    # costs a little per frame: 0 is free
focus_ring_width = 2                  # the color, not the weight, says which is focused
focus_ring_inactive_width = 2
focus_ring_active_color = "#31a9e5"
focus_ring_inactive_color = "#e36e38"

[wallpaper]
# A relative path is resolved against this file's directory.
image = "../../assets/wallpapers/radial-burst.png"
mode = "fill"

[binds]
"super+m" = "set-column-width 3"      # the full-width column above
