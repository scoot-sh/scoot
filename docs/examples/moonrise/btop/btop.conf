# The "moonrise" btop setup: a dark transparent theme in the illustration's
# palette, for a translucent terminal. Copy this file to ~/.config/btop/btop.conf
# and btop/themes/moonrise.theme to ~/.config/btop/themes/moonrise.theme: `color_theme`
# below names that theme, so both copies have to land for the colors to follow.
theme_background = False
truecolor = True
color_theme = "moonrise"
rounded_corners = True
graph_symbol = "braille"
shown_boxes = "cpu mem net"
update_ms = 1500
proc_tree = False
