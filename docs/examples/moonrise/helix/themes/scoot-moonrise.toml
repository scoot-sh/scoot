# The "moonrise" Helix theme: the illustration's palette, background left
# transparent for a translucent terminal. Copy to
# ~/.config/helix/themes/scoot-moonrise.toml.
"ui.background" = {}
"ui.text" = "ink"
"ui.text.focus" = { fg = "ink", modifiers = ["bold"] }
"ui.linenr" = "mist"
"ui.linenr.selected" = { fg = "blue", modifiers = ["bold"] }
"ui.cursor" = { fg = "paper", bg = "blue" }
"ui.cursor.primary" = { fg = "paper", bg = "blue" }
"ui.cursorline.primary" = { bg = "#333f52" }
"ui.selection" = { bg = "#4e3b40" }
"ui.statusline" = { fg = "ink", bg = "#232c3b" }
"ui.statusline.inactive" = { fg = "mist", bg = "#242e3d" }
"ui.statusline.normal" = { fg = "paper", bg = "blue", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "paper", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "paper", bg = "purple", modifiers = ["bold"] }
"ui.virtual.indent-guide" = "#3a465a"
"ui.virtual.ruler" = { bg = "#242e3d" }
"ui.menu" = { fg = "ink", bg = "#242e3d" }
"ui.menu.selected" = { fg = "paper", bg = "blue" }
"ui.popup" = { bg = "#242e3d" }
"ui.help" = { bg = "#242e3d" }
"ui.window" = "mist"
keyword = { fg = "red", modifiers = ["bold"] }
"keyword.control" = "red"
function = "blue"
"function.macro" = "teal"
type = "purple"
"type.builtin" = "purple"
constructor = "purple"
string = "green"
"constant.character" = "green"
constant = "yellow"
"constant.numeric" = "yellow"
"constant.builtin" = "yellow"
comment = { fg = "mist", modifiers = ["italic"] }
variable = "ink"
"variable.parameter" = "teal"
"variable.other.member" = "ink"
operator = "red"
punctuation = "slate"
namespace = "teal"
attribute = "teal"
label = "purple"
special = "red"
"markup.heading" = { fg = "blue", modifiers = ["bold"] }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
error = "red"
warning = "yellow"
info = "blue"
hint = "teal"
[palette]
ink = "#f6eedc"
slate = "#c9bfae"
mist = "#9c8b95"
paper = "#2b3648"
blue = "#ffa45c"
red = "#e87f6a"
green = "#a9bd9b"
yellow = "#ffd54a"
purple = "#b595ad"
teal = "#8fb3bd"
