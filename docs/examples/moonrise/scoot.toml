# The "moonrise" look for scoot: a slate-navy background, a disc-amber
# ring around the focused window and a muted mauve one around the rest,
# rounded corners, and the night-sky illustration in
# ../../assets/wallpapers. See README.md in this directory.
#
#   scoot --config docs/examples/moonrise/scoot.toml
#
# Nothing here is a default: every costly part is opt-in (see "What it costs").
#
# The previews were taken at scale 1.5 on a 2560x1664 panel: uncomment to match.
# [output]
# scale = 1.5

[layout]
gap = 20

[appearance]
background_color = "#2B3648"          # shows until the wallpaper is up, and behind it
corner_radius = 14                    # costs a little per frame: 0 is free
focus_ring_width = 2                  # the color, not the weight, says which is focused
focus_ring_inactive_width = 2
focus_ring_active_color = "#FF9A49"
focus_ring_inactive_color = "#5E4B5B"

[wallpaper]
# A relative path is resolved against this file's directory.
image = "../../assets/wallpapers/moonrise.png"
mode = "fill"
