# The "moonrise" look for foot. The palette is the illustration's own hues:
# slate-navy background, cream text, disc amber and yellow, mauve and dusty
# rose, slate blue. `pad` is the room between the text and the window's edge,
# and `alpha` the window's opacity: 0.80 lets the wallpaper show through, 1.0
# is fully opaque. The font is a name, resolved through fontconfig.
#
#   foot --config docs/examples/moonrise/foot.ini
#
[main]
font=FiraCode Nerd Font:size=10.5
pad=18x16 center
[cursor]
style=beam
[colors-dark]
alpha=0.80
background=232c3b
foreground=f6eedc
regular0=1a2230
regular1=c96a63
regular2=8fa382
regular3=e8a34c
regular4=7c8fb0
regular5=9a7b94
regular6=7e9bb0
regular7=c9bfae
bright0=5e6b7f
bright1=e87f6a
bright2=a9bd9b
bright3=ffd54a
bright4=93a8c8
bright5=b595ad
bright6=a8c4d8
bright7=f6eedc
selection-background=4e3b40
selection-foreground=f6eedc
