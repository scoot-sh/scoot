# Portal backend selection for the scoot compositor (`XDG_CURRENT_DESKTOP=scoot`).
#
# Install ONE of these, in the first location that exists for your setup
# (earliest wins; see `portals.conf(5)` for the full lookup order):
#
#   ~/.config/xdg-desktop-portal/scoot-portals.conf   per-user, highest precedence
#   /etc/xdg-desktop-portal/scoot-portals.conf        sysadmin default
#   /usr/share/xdg-desktop-portal/scoot-portals.conf  OS vendor / packager
#
# Requires xdg-desktop-portal 1.17+ (older versions have no `portals.conf`
# and need a `UseIn=scoot` line in each backend's own `.portal` file, which
# is not ours to edit). Nothing here is read until `XDG_CURRENT_DESKTOP`
# names `scoot` -- which the compositor exports to everything it spawns --
# AND the D-Bus activation environment carries it too (a session script runs
# `dbus-update-activation-environment --systemd WAYLAND_DISPLAY
# XDG_CURRENT_DESKTOP ...`; see docs/configuration.md), because the portal
# is D-Bus activated and inherits the bus's environment, not scoot's.
#
# Why `wlr` for capture: scoot deliberately does NOT implement
# `zwlr_screencopy_manager_v1` (see docs/protocols.md) and speaks
# `ext-image-copy-capture-v1` instead -- and since xdg-desktop-portal-wlr
# 0.8.0 that backend speaks it too ("ext_image_copy_capture_v1: Initial
# implementation", v0.8.0 release notes), so `wlr` binds against scoot
# through the ext protocol, not the wlr one. Older xdg-desktop-portal-wlr
# (< 0.8.0) needs the wlr screencopy global scoot omits on purpose: with one
# of those, ScreenCast binds nothing and every request fails -- upgrade the
# backend rather than editing this file. (Avoid 0.8.3, whose release notes
# warn it can stall screen recording; 0.8.4+ is the boring choice.)
#
# Screenshot takes the same backend for a different reason: xdpw's
# Screenshot portal shells out to `grim`, and grim (>= 1.5.0) speaks only
# ext-image-copy-capture -- so `grim` must be installed for screenshots to
# work at all, and no other backend is involved.
#
# Everything else falls through to `gtk`, the generic fallback both niri
# and sway recommend for the non-capture portals (file chooser, open URIs,
# settings, inhibit) — which needs the `xdg-desktop-portal-gtk` package
# installed; without it those portals just degrade, nothing fails. The GNOME backend is deliberately NOT named here:
# niri earns it by implementing org.gnome.Mutter.ScreenCast, which scoot
# does not.

[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
