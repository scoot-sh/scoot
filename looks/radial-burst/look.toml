# Radial Burst: plum field, poster colors. Tokens lifted from
# nix/modules/desktop.nix (palette, fonts, nightTemp, wallpaper) and
# docs/examples/radial-burst/ (terminal hues, ring widths, bar style) per
# docs/backlog/core/look-shipped.md. The registry names no hover: it defaults
# to accent. The image stays under the Unsplash License (see NOTICE); the
# tokens are MIT.
schema = 1
name = "radial-burst"
title = "Radial Burst"
description = "Plum field, blue and orange rings."
polarity = "dark"
license = "MIT AND LicenseRef-Unsplash"

[palette]
background = "#241721"
foreground = "#fdef1d"
dim = "#99911d"
accent = "#31a9e5"
urgent = "#bf128d"
focus = "#31a9e5"
border = "#e36e38"

[terminal]
colors = ["#241721", "#bf128d", "#99911d", "#fdef1d", "#31a9e5", "#6d1d98", "#fa9233", "#fdef1d", "#31a9e5", "#bf128d", "#99911d", "#fdef1d", "#31a9e5", "#bf128d", "#fa9233", "#fdef1d"]

[fonts]
ui = "DroidSansM Nerd Font Propo"
sans = "DejaVu Sans"
mono = "DejaVu Sans Mono"
size = 12.5 # renders the example bar font-size 17

[opacity]
# Raised from 1.0 by the bar-opacity pixman benchmark (docs/scootbar/backlog/resolved/bar-opacity-benchmark-done.md); the example uses 0.88.
bar = 0.88

[shape]
radius = 16
ring-width = 2
ring-inactive-width = 2

[effects]
shadow = "glow"
motion = "spring"
motion-duration-ms = 380
motion-bounce = 0.6

# The launcher's panel is large and opens on a keypress: a shorter run than
# the notification cards' 380 ms, the same spring.
[apps.scootlaunch]
"motion-duration-ms" = 220

[apps.scootnotify]
"card.enter" = "scale"
"card.exit" = "fade"
"card.mark" = "badge"
"card.shape" = "pill"
"card.app-accent" = true
"title.weight" = 800
"title.spacing" = 1

[cursor]
theme = "Mocu"
size = 24

[wallpaper]
image = "wallpaper.png"
mode = "fill"
transition = "fade"

[night]
temperature = 3500

[apps.scootbar]
"bar.padding" = 12
"bar.spacing" = 14
