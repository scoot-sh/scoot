# Vinyl Sunset: warm espresso background, sunset-orange ring, desk-sunset
# wallpaper. Tokens lifted from nix/modules/desktop.nix (palette, fonts,
# nightTemp) and docs/examples/vinyl-sunset/ (terminal hues, ring widths,
# bar style) per docs/backlog/core/look-shipped.md. The wallpaper is an
# AI-generated image made by the maintainer, shipped under MIT (see NOTICE).
schema = 1
name = "vinyl-sunset"
title = "Vinyl Sunset"
description = "Warm espresso, sunset-orange ring, desk-sunset wallpaper."
polarity = "dark"
license = "MIT"

[palette]
background = "#270E0A"
foreground = "#F6E8CB"
dim = "#AA6D5F"
accent = "#FE9949"
urgent = "#CE6B4B"
hover = "#FEC69A"
focus = "#FE9949"
border = "#7D4564"

[terminal]
colors = ["#411711", "#c85b37", "#a5c643", "#da973e", "#6a7fbd", "#b2676d", "#878cb6", "#eac985", "#803a23", "#d58267", "#b8d26a", "#ffd757", "#95a4d0", "#c89397", "#adb0cd", "#f6e8cb"]

[fonts]
ui = "DroidSansM Nerd Font Propo"
sans = "DejaVu Sans"
mono = "FiraCode Nerd Font"
size = 10 # renders the example bar font-size 13

[opacity]
# 1.0 until the bar-opacity pixman benchmark passes; the example uses 0.78.
bar = 1.0

[shape]
radius = 12
ring-width = 2
ring-inactive-width = 2

[cursor]
theme = "Mocu"
size = 24

[wallpaper]
image = "wallpaper.png"
mode = "fill"
transition = "fade"

[night]
temperature = 3200

[apps.scootbar]
"bar.padding" = 10
"bar.separator" = 1
"bar.spacing" = 8
"workspaces.inactive-color" = "#BE7E84"
