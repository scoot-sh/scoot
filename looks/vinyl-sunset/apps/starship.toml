# The "vinyl sunset" prompt for starship, in the illustration's palette, for a dark
# translucent terminal. The look's apps/starship.toml static leaf.
add_newline = false
format = "$directory$git_branch$nix_shell$cmd_duration$character"
[directory]
style = "bold #FE9949"
truncation_length = 3
[git_branch]
symbol = " "
style = "#BE7E84"
format = "[$symbol$branch]($style) "
[nix_shell]
symbol = "󱄅 "
style = "#878CB6"
format = "[$symbol]($style)"
[cmd_duration]
style = "#AC6F61"
[character]
success_symbol = "[❯](bold #FEC69A)"
error_symbol = "[❯](bold #CE6B4B)"
