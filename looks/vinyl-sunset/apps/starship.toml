# The "vinyl sunset" prompt for starship, in the illustration's palette, for a dark
# translucent terminal. The look's apps/starship.toml static leaf.
add_newline = false
format = "$directory$git_branch$nix_shell$cmd_duration$character"
[directory]
style = "bold #E59560"
truncation_length = 3
[git_branch]
symbol = " "
style = "#A08C7A"
format = "[$symbol$branch]($style) "
[nix_shell]
symbol = "󱄅 "
style = "#7FA3A0"
format = "[$symbol]($style)"
[cmd_duration]
style = "#604F50"
[character]
success_symbol = "[❯](bold #FDC58B)"
error_symbol = "[❯](bold #C76B47)"
