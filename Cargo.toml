[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Smithay's minimum; the compositor sets the floor for everything.
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
flexwm-core = { path = "crates/flexwm-core" }
flexwm-ipc = { path = "crates/flexwm-ipc" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
